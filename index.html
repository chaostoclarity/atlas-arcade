<!doctype html>
<html lang="en">
<head>
<!--pwa-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b59c3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Geography games for the whole family: find countries, label maps, shapes, borders, capitals and flags.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<!--/pwa-->
<title>Atlas Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: classroom pull-down map turned arcade. Header + mode rail, then a control panel beside a big map stage (stacks on phones). */
:root{
  --bg:#e8eef1; --panel:#ffffff; --ink:#13212b; --muted:#566874; --line:#cdd8de;
  --water:#8ec3da; --sphere:#a3cfe2; --land:#e6ecdc; --ctx:#d3d9cb; --stroke:#5d6f5a;
  --act:#fbfcf3; --act-hover:#ffe98a;
  --accent:#2b59c3; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --good:#2b8a3e; --good-fill:#8ce99a; --bad:#d6336c; --bad-fill:#ffa8c5; --hint:#e67700; --hint-fill:#ffd8a8;
  --halo:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --panel:#15222b; --ink:#e4edf1; --muted:#93a6b1; --line:#283a45;
  --water:#0b2230; --sphere:#0f2d3d; --land:#2d4038; --ctx:#26342e; --stroke:#7d9a8b;
  --act:#3f5e49; --act-hover:#6b6a2a;
  --accent:#7aa2ff; --accent-ink:#0b1430; --accent-soft:#1d2d55;
  --good:#69db7c; --good-fill:#2f9e44; --bad:#ff8ab0; --bad-fill:#a61e4d; --hint:#ffc078; --hint-fill:#d9480f;
  --halo:#0e171d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171d; --panel:#15222b; --ink:#e4edf1; --muted:#93a6b1; --line:#283a45;
  --water:#0b2230; --sphere:#0f2d3d; --land:#2d4038; --ctx:#26342e; --stroke:#7d9a8b;
  --act:#3f5e49; --act-hover:#6b6a2a;
  --accent:#7aa2ff; --accent-ink:#0b1430; --accent-soft:#1d2d55;
  --good:#69db7c; --good-fill:#2f9e44; --bad:#ff8ab0; --bad-fill:#a61e4d; --hint:#ffc078; --hint-fill:#d9480f;
  --halo:#0e171d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{max-width:1320px;margin:0 auto;grid-template-columns:minmax(0,1fr);padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,32px);margin:0;letter-spacing:-.02em;line-height:1}
.brand h1 em{font-style:normal;color:var(--accent)}
.globe-mark{width:30px;height:30px;flex:none}
.pickers{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pickers.off{display:none}
select{padding:7px 30px 7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who select{font-weight:700}
.who input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:150px}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th,.board td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.board th:first-child,.board td:first-child{text-align:left}
.board th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.board td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.board td:first-child{font-family:var(--body);font-weight:700}
.board tr.me td{background:var(--accent-soft)}
.board td.lead{color:var(--good);font-weight:600}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px 8px;min-width:104px}
.tab b{font-family:var(--display);font-weight:600;font-size:15px}
.tab span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-current="page"] span{color:var(--accent-ink);opacity:.8}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1.1}
.how{margin:2px 0 0;color:var(--muted);font-size:14px}
.meter{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.meter .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--good)}
.prompt{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.prompt small{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.prompt strong{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.1;text-wrap:balance}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;height:min(64vh,640px);background:var(--water);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
svg.map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.water{fill:var(--water)}
.sphere{fill:var(--sphere);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:var(--line);stroke-width:.5;vector-effect:non-scaling-stroke;opacity:.6}
.f{fill:var(--ctx);stroke:var(--stroke);stroke-width:.85;vector-effect:non-scaling-stroke;transition:fill .2s}
.f.act{fill:var(--act);cursor:pointer}
.f.act:hover{fill:var(--act-hover)}
.f.sel,.dot.sel{fill:var(--accent)}
.f.ok,.dot.ok{fill:var(--good-fill)}
.f.meh,.dot.meh{fill:var(--hint-fill)}
.f.bad,.dot.bad{fill:var(--bad-fill)}
.f.reveal,.dot.reveal{fill:var(--hint-fill);stroke:var(--hint);stroke-width:2}
.f.base{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.f.endpt,.dot.endpt{fill:var(--accent);stroke:var(--accent)}
.stl{fill:none;stroke:var(--stroke);stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.8}
.dot{fill:var(--act);stroke:var(--stroke);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.lbl{font-family:var(--body);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.lbl.end{fill:var(--accent)}
.lbl.miss{fill:var(--hint)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.toast.good{border-color:var(--good);color:var(--good)}
.zoomctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.hint-line{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:6px;opacity:.92;pointer-events:none}
/* guess input */
.guess{position:relative}
.guess input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.guess ul{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.guess li{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.guess li small{color:var(--muted)}
.guess li[aria-selected="true"],.guess li:hover{background:var(--accent-soft)}
/* choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 10px;cursor:pointer;font-weight:600;text-align:left;min-height:48px}
.choice:hover{border-color:var(--accent)}
.choice.ok{background:var(--good-fill);border-color:var(--good)}
.choice.bad{background:var(--bad-fill);border-color:var(--bad)}
.choice.flag{padding:8px;display:grid;place-items:center}
.choice.flag img{width:100%;max-width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.bigflag{width:100%;max-width:260px;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);justify-self:center;background:var(--bg)}
/* label tray */
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:grab;font-weight:700;touch-action:none;user-select:none}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-style:solid}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 10px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
/* guess rows */
.rows{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.grow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.grow .arrow{display:inline-block;font-size:18px;line-height:1;color:var(--accent)}
.grow.win{background:var(--good-fill)}
.grow .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.grow.empty{opacity:.45;min-height:34px}
.sil{background:var(--bg);border-radius:10px;display:grid;place-items:center;padding:8px}
.sil svg{width:100%;max-width:240px;height:auto}
.sil path{fill:var(--ink)}
.chainhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:22px}
.chainhead span{color:var(--muted);font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--bg);font-weight:600}
.chip.on{background:var(--good-fill);border-color:var(--good)}
.chip.off{background:var(--hint-fill);border-color:var(--hint)}
.chip.hintc{border-style:dashed}
button.chip{cursor:pointer}
.end{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.end .score{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.end p{margin:0;color:var(--muted)}
.info{display:grid;gap:10px}
.info .head{display:flex;gap:12px;align-items:center}
.info .head img{width:64px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.info h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0;line-height:1.1}
.info .off{color:var(--muted);font-size:13px}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:62px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.ctl output{font-family:var(--mono);text-align:right;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px}
.verdict{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.verdict b{color:var(--accent)}
#ov{cursor:grab}
#ov.drag{cursor:grabbing}
#ov path{fill:color-mix(in srgb,var(--bad) 32%,transparent);stroke:var(--bad);stroke-width:1.8;vector-effect:non-scaling-stroke}
#ov text{font-family:var(--display);font-weight:800;fill:var(--bad);text-anchor:middle;paint-order:stroke;stroke:var(--halo);pointer-events:none}
.note{font-size:12.5px;color:var(--muted);margin:0}
.helpbtn{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--accent);background:var(--panel);color:var(--accent);font-family:var(--display);font-weight:800;font-size:20px;cursor:pointer;line-height:1}
.helpbtn:hover{background:var(--accent);color:var(--accent-ink)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,16,24,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--panel);color:var(--ink);border-radius:18px;padding:22px 22px 20px;max-width:520px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);display:grid;gap:10px}
.modal h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1}
.modal .goal{margin:0;font-size:18px;font-weight:600;color:var(--accent)}
.modal ol{margin:4px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:17px;line-height:1.45}
.modal .btn{width:100%;min-height:52px;font-size:18px}
.lbl.nm{font-weight:600;fill:var(--muted)}
.clues{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.clues li{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-weight:600}
.grow.headrow{background:none;padding-block:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.temp{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:#1b1b1b;white-space:nowrap}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.qbar{display:none}
.modehead{display:grid;gap:10px}
/* Landscape (iPad sideways, laptops, phones sideways): panel beside a map that fills the screen height */
@media (orientation:landscape) and (min-width:640px){
  .app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;grid-template-rows:auto auto minmax(0,1fr)}
  .main{min-height:0;grid-template-columns:clamp(270px,30vw,340px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:stretch}
  .panel{overflow-y:auto;align-content:start;overscroll-behavior:contain}
  .stage{height:auto;min-height:0}
}
@media (orientation:landscape) and (max-height:520px){
  .app{padding-block:6px 8px;gap:6px;min-height:0}
  .brand h1{font-size:20px}.globe-mark{width:22px;height:22px}
  .top{gap:6px 12px}.top .lab{display:none}
  .tab{min-width:0;padding:5px 10px}.tab span{display:none}.tab b{font-size:13.5px;white-space:nowrap}
  .panel{padding:12px;gap:10px}.panel h2{font-size:19px}.how{font-size:13px}
  select,.seg button{padding-block:5px}
  .hint-line{display:none}
}
/* ===== Portrait: phones and iPad upright ===== */
@media (orientation:portrait),(max-width:639px){
  body{font-size:17px}
  .app{max-width:none;padding:0;gap:0}
  .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .brand{min-width:0;overflow:hidden}.brand h1{font-size:clamp(18px,5.4vw,22px);white-space:nowrap}.globe-mark{width:26px;height:26px}
  .who{gap:8px}.who select{height:46px;font-size:17px;font-weight:700;max-width:34vw}
  .who input{height:46px;font-size:17px;width:40vw}
  .pickers{grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:8px}
  .pickers select{flex:1;min-width:0;width:0;height:48px;font-size:17px}
  .seg{border-radius:10px}.seg button{height:48px;padding:0 14px;font-size:16px}
  .tabs{background:var(--panel);border-bottom:1px solid var(--line);gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{min-width:0;padding:11px 18px;border-radius:999px}.tab span{display:none}.tab b{font-size:17px;white-space:nowrap}
  .main{display:flex;flex-direction:column;gap:0;align-items:stretch}
  .panel{border:0;border-radius:0;gap:14px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panel h2{font-size:24px}.how{font-size:15.5px}
  .stage{border:0;border-radius:0;height:min(64vh,120vw)}
  .main[data-mode="capitals"] .stage,.main[data-mode="flags"] .stage{height:min(46vh,90vw)}
  .main[data-mode="players"] .stage{order:-1;height:auto}
  .btn{min-height:50px;font-size:17px;padding:10px 20px;border-radius:12px}
  .choices{gap:10px}.choice{min-height:68px;font-size:19px;padding:14px;border-radius:14px}
  .choice.flag img{max-width:100%}
  .guess input{height:56px;font-size:19px;border-radius:12px;padding:0 16px}
  .guess li{padding:12px 14px;font-size:17px}
  .prompt{padding:14px 16px;border-radius:14px}.prompt small{font-size:12.5px}.prompt strong{font-size:32px}
  .stats{font-size:15px;gap:18px}
  .grow{padding:11px 14px;font-size:17px;border-radius:10px}.grow .num{font-size:15px}.grow .arrow{font-size:22px}
  .tag{font-size:17px;padding:10px 14px;border-radius:12px}
  .tray{gap:8px}
  .chip{font-size:16px;padding:7px 14px}
  .chainhead{font-size:22px}
  .end .score{font-size:40px}.end{padding:18px;border-radius:14px}
  .zoomctl{right:max(12px,env(safe-area-inset-right,0px));bottom:12px;gap:8px}
  .zoomctl button{width:50px;height:50px;font-size:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .hint-line,.qbar{display:none}
  .toast{top:12px;font-size:16px;padding:9px 18px}
  .bigflag{max-width:100%}
  .sil svg{max-width:260px}
  .board th,.board td{padding:10px 12px;font-size:15px}
  .ctl{grid-template-columns:70px minmax(0,1fr) 56px;font-size:15px}
  input[type=range]{height:32px}

  /* Map modes become a full-screen app: the map fills the screen and controls sit in a bottom sheet */
  .app[data-shell="sheet"]{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
  .app[data-shell="sheet"] .main{flex:1 1 auto;min-height:0}
  .app[data-shell="sheet"] .top,.app[data-shell="sheet"] .tabs{flex:none}
  .app[data-shell="sheet"] .stage{order:-1;flex:1 1 auto;height:auto;min-height:200px}
  .app[data-shell="sheet"] .panel{flex:0 1 auto;max-height:48%;overflow-y:auto;overscroll-behavior:contain;position:relative;z-index:3;margin-top:-16px;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.14);padding-block:16px max(16px,env(safe-area-inset-bottom,0px));gap:12px}
  .app[data-shell="sheet"] .panel::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 2px}
  .app[data-shell="sheet"] .modehead{display:none}
  .app[data-shell="sheet"] .zoomctl{bottom:28px}
  .main[data-mode="find"] .panel{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .main[data-mode="find"] .panel > *{grid-column:1/-1}
  .main[data-mode="find"] .panel .prompt{grid-column:1/-1}
  .main[data-mode="find"] .panel .stats{grid-column:1}
  .main[data-mode="find"] .panel .row{grid-column:2}
  .main[data-mode="label"] .panel .note{display:none}
  .main[data-mode="label"] .panel{max-height:42%}
}
@media (orientation:portrait) and (min-width:700px){
  .choices{grid-template-columns:repeat(4,minmax(0,1fr))}
  .app[data-shell="sheet"] .panel{max-height:40%}
  .main[data-mode="label"] .tray{justify-content:center}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="globe-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M2 16h28M16 2c-5 5-5 23 0 28M16 2c5 5 5 23 0 28M5 8.5c6 3 16 3 22 0M5 23.5c6-3 16-3 22 0" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/></svg>
      <h1>Atlas <em>Arcade</em></h1>
    </div>
    <div class="who" id="who"></div>
    <div class="pickers" id="pickers">
      <label for="set" class="lab" style="margin:0">Map</label>
      <select id="set"></select>
      <div class="seg" id="diff" role="group" aria-label="Difficulty"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Game modes"></nav>
  <main class="main">
    <section class="panel" id="panel"><div class="loading">Loading the world…</div></section>
    <section class="stage" id="stage"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const R = 6371.0088, KM2MI = 0.386102, W = 960;
let H = 600;
// Size the map's drawing box to the stage it lands in, so it fills portrait and landscape screens alike.
function fitH(){ const r = document.getElementById('stage')?.getBoundingClientRect(); if (r && r.width > 50 && r.height > 50) H = Math.round(Math.max(380, Math.min(1500, W * r.height / r.width))); }
const MODES = [
  {id:'atlas', name:'Atlas', sub:'True size + facts'},
  {id:'find', name:'Find It', sub:'Tap the country'},
  {id:'label', name:'Label It', sub:'Place the names'},
  {id:'shape', name:'Shape', sub:'Guess the outline'},
  {id:'hot', name:'Hot & Cold', sub:'Close in on it'},
  {id:'chain', name:'Border Chain', sub:'Link two places'},
  {id:'capitals', name:'Capitals', sub:'Cities and countries'},
  {id:'flags', name:'Flags', sub:'Know the colors'},
  {id:'players', name:'Players', sub:'Scoreboard'},
];
const SETS = {world:'World',africa:'Africa',asia:'Asia',europe:'Europe',namerica:'North & Central America',samerica:'South America',oceania:'Oceania',us:'US States'};
const BOX = {africa:[-19,-36,52,38],asia:[26,-10,146,55],europe:[-25,34,45,71],namerica:[-168,6,-52,72],samerica:[-82,-56,-34,13],oceania:[112,-48,180,-1]};
// Difficulty = how well known a place is, not how big it is.
// Easy: household names. Medium: places most adults have heard of. Hard: everything else.
const EASY = new Set('USA CAN MEX BRA ARG CHL PER COL VEN CUB JAM GBR IRL FRA DEU ITA ESP PRT NLD BEL CHE AUT GRC POL SWE NOR FIN DNK ISL RUS UKR TUR EGY ZAF NGA KEN ETH MAR MDG IND CHN JPN KOR PRK VNM THA PHL IDN PAK AFG IRN IRQ SAU ISR AUS NZL'.split(' '));
const MED = new Set('HUN CZE SVK ROU BGR SRB HRV BIH SVN ALB EST LVA LTU BLR GEO ARM AZE KAZ UZB MNG LUX MLT MCO VAT CYP KWT QAT ARE OMN YEM JOR LBN SYR PSE MYS SGP KHM LAO MMR NPL BGD LKA TWN DZA TUN LBY SDN SOM TZA UGA RWA GHA SEN CIV CMR COD AGO ZMB ZWE MOZ NAM BWA BOL ECU URY PRY GTM HND NIC CRI PAN SLV DOM HTI BHS PNG FJI'.split(' '));
const US_EASY = new Set('CA TX FL NY AK HI WA OR AZ NV CO IL MI MA GA LA'.split(' '));
const US_MED = new Set('PA OH NC VA NJ TN MN WI NM MT UT MO KY AL SC ID MD OK'.split(' '));
const tier = d => d.type === 'state' ? (US_EASY.has(d.id) ? 1 : US_MED.has(d.id) ? 2 : 3) : (EASY.has(d.id) ? 1 : MED.has(d.id) ? 2 : 3);

// ---------- storage ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const S = Object.assign({set:'world', diff:'medium', capDir:'c2cap', flagDir:'flag2c', player:'Player 1'}, store.get('aa-prefs', {}));
let PLAYERS = store.get('aa-players', null);
if (!PLAYERS){ PLAYERS = ['Player 1']; const old = store.get('aa-stats', null); if (old) store.set('aa-stats:Player 1', old); store.set('aa-players', PLAYERS); }
if (!PLAYERS.includes(S.player)) S.player = PLAYERS[0];
let ST = store.get('aa-stats:' + S.player, {});
const saveS = () => store.set('aa-prefs', {set:S.set, diff:S.diff, capDir:S.capDir, flagDir:S.flagDir, player:S.player});
function rec(mode, id, ok){ const k = mode+':'+id, v = ST[k] || [0,0]; ok ? v[0]++ : v[1]++; ST[k] = v; store.set('aa-stats:' + S.player, ST); }
function switchPlayer(name){ S.player = name; ST = store.get('aa-stats:' + name, {}); saveS(); renderPlayers(); route(); }
function weight(mode, id){ const v = ST[mode+':'+id]; return v ? Math.min(3, Math.max(.3, 1 + v[1] - .5*v[0])) : 1.5; }
const RECENT = {};
function known(mode, arr){ return arr.filter(d => { const v = ST[mode+':'+d.id]; return v && v[0] >= 2 && v[0] > v[1]; }).length; }
// Weighted random draw: missed places come up more often, but never every time, and recent ones sit out.
function pickN(mode, arr, n){
  const pool = arr.slice(), out = [], recent = RECENT[mode] || [];
  const room = pool.length > recent.length + n;
  while (out.length < n && pool.length){
    const ws = pool.map(d => weight(mode, d.id) * (room && recent.includes(d.id) ? .02 : 1));
    let r = Math.random() * ws.reduce((a,b) => a+b, 0), i = 0;
    while (i < ws.length - 1 && (r -= ws[i]) > 0) i++;
    out.push(pool.splice(i,1)[0]);
  }
  RECENT[mode] = [...out.map(d => d.id), ...recent].slice(0, Math.min(15, Math.floor(arr.length/2)));
  return out;
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const close = (a,b) => { a = norm(a); b = norm(b); return a === b || (b.length > 4 && lev(a,b) <= (b.length > 8 ? 2 : 1)); };
const fmt = n => n >= 100 ? Math.round(n).toLocaleString() : n.toLocaleString(undefined,{maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- data ----------
let C = [], US = [], BY = new Map();
function trim(f){
  const g = f.geometry; if (g.type !== 'MultiPolygon') return f;
  const ps = g.coordinates.map(c => { const p = {type:'Polygon',coordinates:c}; return {c, a:d3.geoArea(p), cen:d3.geoCentroid(p)}; });
  const main = ps.reduce((a,b) => b.a > a.a ? b : a);
  const keep = ps.filter(p => d3.geoDistance(p.cen, main.cen) * 180/Math.PI <= 30);
  return {type:'Feature', geometry:{type:'MultiPolygon', coordinates:keep.map(p => p.c)}};
}
function prep(d, type){
  d.type = type; d.f = {type:'Feature', id:d.id, geometry:d.g};
  d.ft = trim(d.f); d.cen = d3.geoCentroid(d.ft);
  d.garea = d3.geoArea(d.ft) * R * R;
  if (type === 'state') d.a = d3.geoArea(d.f) * R * R;
  d.pt = (type === 'country' && d.ll2) ? [d.ll2[1], d.ll2[0]] : d.cen;
  BY.set(d.id, d); return d;
}
const universe = set => set === 'us' ? US : C;
function inSet(d, set){
  if (set === 'us') return d.type === 'state';
  if (d.type !== 'country' || !d.sov) return false;
  if (set === 'world') return true;
  if (set === 'africa') return d.r === 'Africa';
  if (set === 'asia') return d.r === 'Asia';
  if (set === 'europe') return d.r === 'Europe';
  if (set === 'oceania') return d.r === 'Oceania';
  if (set === 'samerica') return d.sr === 'South America';
  if (set === 'namerica') return ['North America','Central America','Caribbean'].includes(d.sr);
}
function pool(set = S.set, diff = S.diff){
  const all = universe(set).filter(d => inSet(d, set));
  // Medium includes Easy, Hard includes everything. Small regions borrow from the next level so a round has enough places.
  let lvl = {easy:1, medium:2, hard:3}[diff], out = all.filter(d => tier(d) <= lvl);
  while (out.length < 6 && lvl < 3){ lvl++; out = all.filter(d => tier(d) <= lvl); }
  return out;
}

// ---------- shell ----------
const $ = s => document.querySelector(s);
const panel = $('#panel'), stage = $('#stage');
function shell(){
  $('#set').innerHTML = Object.entries(SETS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  $('#set').value = S.set;
  $('#set').onchange = e => { S.set = e.target.value; saveS(); route(); };
  $('#diff').innerHTML = ['easy','medium','hard'].map(d => `<button type="button" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('');
  $('#diff').onclick = e => { const d = e.target.dataset.d; if (!d) return; S.diff = d; saveS(); route(); };
  $('#tabs').innerHTML = MODES.map(m => `<a class="tab" href="#${m.id}" data-m="${m.id}"><b>${m.name}</b><span>${m.sub}</span></a>`).join('');
  window.addEventListener('hashchange', route);
  let rz, lastO = innerWidth > innerHeight;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
    const o = innerWidth > innerHeight, m = document.querySelector('.main').dataset.mode;
    // Re-lay out stateless views right away; games keep their progress and the map letterboxes until the next round.
    if (C.length && (o !== lastO) && (m === 'atlas' || m === 'players')) route();
    lastO = o; }, 250); });
  renderPlayers();
}
function renderPlayers(adding=false){
  const w = $('#who');
  if (adding){
    w.innerHTML = `<label for="np" class="lab" style="margin:0">New player</label><input id="np" type="text" maxlength="20" placeholder="Name" autocomplete="off"><button class="btn primary" type="button" id="npok">Add</button><button class="btn" type="button" id="npx">Cancel</button>`;
    const add = () => { const n = $('#np').value.trim().slice(0,20); if (!n) return $('#np').focus(); if (!PLAYERS.includes(n)){ PLAYERS.push(n); store.set('aa-players', PLAYERS); } switchPlayer(n); };
    $('#npok').onclick = add; $('#np').onkeydown = e => { if (e.key === 'Enter') add(); if (e.key === 'Escape') renderPlayers(); };
    $('#npx').onclick = () => renderPlayers(); $('#np').focus(); return;
  }
  w.innerHTML = `<button type="button" class="helpbtn" id="help" aria-label="How to play">?</button><label for="pl" class="lab" style="margin:0">Player</label><select id="pl">${PLAYERS.map(p => `<option${p === S.player ? ' selected' : ''}>${esc(p)}</option>`).join('')}<option value="__new">+ Add player</option></select>`;
  $('#help').onclick = () => showRules(document.querySelector('.main').dataset.mode || 'find');
  $('#pl').onchange = e => { if (e.target.value === '__new'){ e.target.value = S.player; renderPlayers(true); } else switchPlayer(e.target.value); };
}
let cleanup = null;
function route(){
  document.querySelector('.modal')?.remove();
  const m = (location.hash || '#find').slice(1);
  const mode = MODES.find(x => x.id === m) ? m : 'find';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.m === mode ? 'page' : 'false'));
  document.querySelectorAll('#diff button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === S.diff));
  $('#set').value = S.set;
  $('#pickers').classList.toggle('off', mode === 'atlas');
  $('#set').disabled = false;
  document.querySelector('.main').dataset.mode = mode;
  document.querySelector('.main').dataset.set = S.set;
  document.querySelector('.app').dataset.shell = ['find','label','atlas','hot','chain'].includes(mode) ? 'sheet' : '';
  if (cleanup) { try{ cleanup(); }catch(e){} cleanup = null; }
  panel.innerHTML = ''; stage.innerHTML = '';
  fitH();
  setTimeout(() => maybeRules(mode), 50);
  cleanup = ({atlas:modeAtlas, players:modePlayers, find:modeFind, label:modeLabel, shape:modeShape, hot:modeHot, chain:modeChain, capitals:modeCapitals, flags:modeFlags})[mode]() || null;
}
function head(title, how, mode, items){
  const k = mode && items ? known(mode, items) : null;
  return `<div class="modehead"><div><h2>${title}</h2><p class="how">${how}</p></div>` +
    (k !== null ? `<div class="meter"><span>You know <b class="num">${k}</b> of <span class="num">${items.length}</span> in ${SETS[S.set]}</span><div class="bar"><i style="width:${items.length ? k/items.length*100 : 0}%"></i></div></div>` : '') + '</div>';
}
let toastT;
function toast(msg, kind=''){
  let t = stage.querySelector('.toast'); if (!t){ t = document.createElement('div'); stage.appendChild(t); }
  t.className = 'toast ' + kind; t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800);
}
function flagImg(d, cls=''){ return d.c2 ? `<img class="${cls}" src="data/flags/${d.c2}.svg" alt="Flag of ${esc(d.n)}">` : ''; }

// ---------- rules ----------
const RULES = {
  atlas:{title:'Atlas', goal:'See how big places really are, and learn facts about any country.', steps:[
    'The red shape is the overlay. Type in the top box to pick a different country or US state.',
    'The blue-outlined country underneath is the base. Change it in the second box.',
    'Drag the red shape anywhere. Use Rotate and Zoom to line it up.',
    'Both are drawn at the same scale, so what you see is their real size.',
    'Tap any country on the map to see its flag, capital, languages and neighbors.']},
  find:{title:'Find It', goal:'Find each country on the map.', steps:[
    'We name a country. Tap it on the map.',
    'Right on the first tap scores a point and turns it green.',
    'A wrong tap tells you which country you hit. You get three tries.',
    'After three misses we show you where it is (orange) and move on.',
    'Ten countries per round. Tiny countries show as dots. Pinch or use + to zoom.']},
  label:{title:'Label It', goal:'Put every name on the right country.', steps:[
    'The highlighted (lighter) countries on the map are the ones to label.',
    'Tap a name in the tray, then tap its country. You can also drag the name onto the map.',
    'A correct name sticks to the map and turns the country green.',
    'A wrong tap flashes red and counts as a miss.',
    'Place all the names to finish the round.']},
  shape:{title:'Shape', goal:'Name the mystery country from its outline.', steps:[
    'The black shape is the mystery country. It is enlarged to fill the box, so size is no clue.',
    'Type a guess. You get six.',
    'Each wrong guess shows how far your guess is from the answer in km.',
    'The arrow points from your guess toward the answer. ↑ means north, → means east.',
    'The % is how close you are. 100% is right on. Higher is warmer.',
    'Stuck? Tap Clue for the region, the size, or the first letter.']},
  hot:{title:'Hot & Cold', goal:'Find the secret country by getting warmer.', steps:[
    'There is a secret country. You can guess any country, as many times as you like.',
    'Each guess is colored on the globe and listed with a temperature: Cold, Cool, Warm, Hot, or Touching.',
    'Touching means your guess shares a border with the secret country. You are right next to it.',
    'The km is the gap between the two countries, and the arrow points toward the secret one.',
    'You start with one clue. Tap Another clue for more: size, coastline, neighbors, first letter, capital.',
    'Drag to spin the globe. Fewer guesses is better.']},
  chain:{title:'Border Chain', goal:'Connect the two blue countries over land.', steps:[
    'Start in one blue country and reach the other, crossing land borders only.',
    'Type countries that link them. Each one must touch the chain on the map.',
    'Example: France to Poland works through Germany, because France touches Germany and Germany touches Poland.',
    'Only the main part of each country counts. Cut-off pieces, like Russia\'s Kaliningrad next to Poland, don\'t.',
    'Green means the country is on a shortest route. Orange means it connects, but the long way.',
    'You win when your countries form an unbroken path. Guesses are limited, so plan ahead.',
    'Hint fills in one link and costs a guess.']},
  capitals:{title:'Capitals', goal:'Match countries with their capital cities.', steps:[
    'Pick a direction at the top: Country → Capital, or Capital → Country.',
    'Easy and Medium: tap one of four. Watch out: the choices include big cities that are not the capital (Sydney for Australia), and capitals of nearby countries.',
    'Hard: type the answer. Small typos are fine.',
    'The map shows where the country is, with country names on it.',
    'A right answer moves on by itself. After a wrong one, read the answer and tap Next.',
    'Ten per round. Countries you miss come back more often.']},
  flags:{title:'Flags', goal:'Match flags and countries.', steps:[
    'Pick a direction at the top: Flag → Country, or Country → Flag.',
    'Easy and Medium: tap one of four. Hard: type the country, or pick from six flags.',
    'After you answer, the map shows where that country is.',
    'Ten per round. Flags you miss come back more often.']},
  players:{title:'Players', goal:'Track who knows the most.', steps:[
    'Each person gets their own player. Switch players at the top of the screen.',
    'A place counts as known once you get it right at least twice, and more often than you miss it.',
    'Green numbers lead each game. The star marks the overall leader.',
    'Change the map at the top to compare a different region.']}
};
function showRules(mode){
  const r = RULES[mode]; if (!r) return;
  document.querySelector('.modal')?.remove();
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label', 'How to play ' + r.title);
  m.innerHTML = `<div class="sheet"><p class="lab">How to play</p><h2>${r.title}</h2><p class="goal">${r.goal}</p><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol><button type="button" class="btn primary" id="gotit">Got it, let's play</button></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector('#gotit').onclick = close; m.onclick = e => { if (e.target === m) close(); };
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  m.querySelector('#gotit').focus();
}
function maybeRules(mode){
  const seen = store.get('aa-rules-seen:' + S.player, {});
  if (!seen[mode] && RULES[mode]){ seen[mode] = 1; store.set('aa-rules-seen:' + S.player, seen); showRules(mode); }
}
// Clues shared by Shape and Hot & Cold
function clues(d){
  const big = US.slice().sort((x,y) => Math.abs(Math.log(d.garea/x.garea)) - Math.abs(Math.log(d.garea/y.garea)))[0];
  const nb = (d.b0 || d.b || []).length;
  const sizeClue = d.type === 'state' ? `About ${Math.round(d.garea / BY.get('TX').garea * 100)}% the size of Texas` : (big.id === d.id ? '' : `About the size of ${big.n} (a US state)`);
  return (d.type === 'country' ? [
    `It's in ${d.sr || d.r}`, sizeClue,
    d.ll ? 'It is landlocked: no coastline' : 'It has a coastline',
    nb ? `It borders ${nb} countr${nb === 1 ? 'y' : 'ies'}` : 'It borders no other country (island or isolated)',
    `It starts with "${d.n[0]}"`, d.cap[0] ? `Its capital is ${d.cap[0]}` : ''
  ] : [
    sizeClue, nb ? `It borders ${nb} state${nb === 1 ? '' : 's'}` : 'It borders no other state',
    `It starts with "${d.n[0]}"`, `Its capital is ${d.cap[0]}`
  ]).filter(Boolean);
}

// ---------- map ----------
function fc(fs){ return {type:'FeatureCollection', features:fs}; }
function boxGeo(b){ const mx = (b[0]+b[2])/2; return {type:'MultiPoint', coordinates:[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]],[mx,b[1]],[mx,b[3]],[b[0],(b[1]+b[3])/2],[b[2],(b[1]+b[3])/2]]}; }
function projFor(set, fitItems){
  const ext = [[16,16],[W-16,H-16]];
  if (set === 'us') return d3.geoAlbersUsa().fitExtent(ext, fc((fitItems || US).map(d => d.f)));

function makeMap(host, {set=S.set, items=universe(set), active=new Set(), fit=null, onPick=null}){
  fitH();

  const proj = projFor(set, fit), path = d3.geoPath(proj);
  svg.append('rect').attr('class','water').attr('width',W).attr('height',H);
  const g = svg.append('g');
  if (set !== 'us'){
    g.append('path').attr('class','sphere').attr('d', path({type:'Sphere'}));
    g.append('path').attr('class','grat').attr('d', path(d3.geoGraticule10()));
  }
  const fp = g.append('g').selectAll('path').data(items, d => d.id).join('path')
    .attr('class', d => 'f' + (active.has(d.id) ? ' act' : '')).attr('d', d => path(d.f));
  fp.append('title').text(d => active.has(d.id) || !onPick ? '' : d.n);
  const tiny = items.filter(d => active.has(d.id) && path.area(d.ft) < 45 && proj(d.cen));
  const dots = g.append('g').selectAll('circle').data(tiny, d => d.id).join('circle').attr('class','dot act')
    .attr('cx', d => proj(d.cen)[0]).attr('cy', d => proj(d.cen)[1]).attr('r', 7);
  const nmG = g.append('g');
  const lab = g.append('g');
  let k = 1;
  // viewBox units per screen pixel, so labels and tap dots keep a readable size on small screens
  const px = () => W / Math.max(1, svg.node().getBoundingClientRect().width || W);
  const dotR = () => Math.max(7, 5.5 * px()) / Math.sqrt(k), fs = () => 14 * px() / k;
  // Country names: shown only where the country is big enough on screen to hold its name
  function updNames(){ const p = px(), f = 12 * p / k;
    nmG.selectAll('text').attr('font-size', f).attr('stroke-width', f/4).attr('display', d => {
      const b = path.bounds(d.ft), wpx = (b[1][0]-b[0][0]) * k / p, hpx = (b[1][1]-b[0][1]) * k / p;
      return wpx > d.n.length * 6.5 && hpx > 12 ? null : 'none'; }); }
  dots.attr('r', dotR());
  if (onPick){ fp.on('click', (e,d) => onPick(d,e)); dots.on('click', (e,d) => onPick(d,e)); }
  const zb = d3.zoom().scaleExtent([1, 24]).translateExtent([[-W*.2,-H*.2],[W*1.2,H*1.2]]).on('zoom', e => {
    g.attr('transform', e.transform); k = e.transform.k;
    dots.attr('r', dotR()); lab.selectAll('text').attr('font-size', fs()).attr('stroke-width', fs()/4); updNames();
  });
  svg.call(zb).on('dblclick.zoom', null);
  // On tall screens the whole world is a thin strip, so open zoomed in on the middle; pinch or reset to see it all.
  let home = d3.zoomIdentity;
  if (set === 'world' && !fit && H/W > .7){ const k = Math.min(2.1, (H/W)/.52), c = proj([18, 22]); home = d3.zoomIdentity.translate(W/2, H/2).scale(k).translate(-c[0], -c[1]); svg.call(zb.transform, home); }
  const zc = document.createElement('div'); zc.className = 'zoomctl';
  zc.innerHTML = '<button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button><button type="button" aria-label="Reset zoom" style="font-size:13px">⤢</button>';
  const [zi, zo, zr] = zc.querySelectorAll('button');
  zi.onclick = () => svg.transition().duration(300).call(zb.scaleBy, 1.8);
  zo.onclick = () => svg.transition().duration(300).call(zb.scaleBy, 1/1.8);
  zr.onclick = () => svg.transition().duration(400).call(zb.transform, d3.zoomIdentity);
  zr.title = 'Show the whole map';
  host.appendChild(zc);
  const sel = id => [fp.filter(d => d.id === id), dots.filter(d => d.id === id)];
  return {
    svg, proj, path,
    cls(id, c, on=true){ sel(id).forEach(s => s.classed(c, on)); },
    clear(c){ fp.classed(c, false); dots.classed(c, false); },
    fill(id, col){ sel(id).forEach(s => s.style('fill', col)); },
    flash(id, c='bad'){ sel(id).forEach(s => { s.classed(c, true); setTimeout(() => s.classed(c, false), 650); }); },
    label(d, text, cls=''){ const p = proj(d.cen); if (!p) return; lab.selectAll(`text[data-id="${d.id}"]`).remove();
      lab.append('text').attr('data-id', d.id).attr('class','lbl ' + cls).attr('x', p[0]).attr('y', p[1]).attr('font-size', fs()).attr('stroke-width', fs()/4).text(text); },
    clearLabels(){ lab.selectAll('*').remove(); },
    names(list){ nmG.selectAll('text').data(list.filter(d => proj(d.cen)), d => d.id).join('text').attr('class','lbl nm')
      .attr('x', d => proj(d.cen)[0]).attr('y', d => proj(d.cen)[1]).text(d => d.n); updNames(); },
    focus(list, maxK=8){
      const bs = list.map(d => path.bounds(d.ft)).filter(b => isFinite(b[0][0]));
      if (!bs.length) return;
      const x0 = d3.min(bs, b => b[0][0]), y0 = d3.min(bs, b => b[0][1]), x1 = d3.max(bs, b => b[1][0]), y1 = d3.max(bs, b => b[1][1]);
      const kk = Math.max(1, Math.min(maxK, .55 / Math.max((x1-x0+20)/W, (y1-y0+20)/H)));
      svg.transition().duration(700).call(zb.transform, d3.zoomIdentity.translate(W/2, H/2).scale(kk).translate(-(x0+x1)/2, -(y0+y1)/2));
    },
    reset(){ svg.transition().duration(500).call(zb.transform, home); }
  };
}

// ---------- typed guess ----------
function makeGuess(host, {placeholder='Type a country', items, onPick, sub}){
  host.classList.add('guess');
  host.innerHTML = `<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"><ul hidden role="listbox"></ul>`;
  const inp = host.querySelector('input'), ul = host.querySelector('ul');
  let list = [], sel = 0;
  const names = d => [d.n, d.o, ...(d.alt || [])].filter(Boolean);
  function show(){
    const t = norm(inp.value); if (!t){ ul.hidden = true; return; }
    const src = items();
    const score = d => { const ns = names(d).map(norm); if (ns[0] === t) return 0; if (ns.some(n => n === t)) return 1; if (ns[0].startsWith(t)) return 2; if (ns.some(n => n.startsWith(t))) return 3; if (ns.some(n => n.includes(t))) return 4; return 9; };
    list = src.map(d => [d, score(d)]).filter(x => x[1] < 9).sort((a,b) => a[1]-b[1] || a[0].n.localeCompare(b[0].n)).slice(0, 8).map(x => x[0]);
    sel = 0; ul.innerHTML = list.length ? list.map((d,i) => `<li role="option" aria-selected="${i===0}" data-i="${i}">${esc(d.n)}${sub ? `<small>${esc(sub(d))}</small>` : ''}</li>`).join('') : '<li>No match</li>';
    ul.hidden = false;
  }
  function pick(d){ ul.hidden = true; inp.value = ''; onPick(d); inp.focus(); }
  inp.addEventListener('input', show);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ if (!list.length) return; e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length; [...ul.children].forEach((li,i) => li.setAttribute('aria-selected', i===sel)); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (!ul.hidden && list[sel]) pick(list[sel]); }
    else if (e.key === 'Escape') ul.hidden = true;
  });
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li && li.dataset.i) { e.preventDefault(); pick(list[+li.dataset.i]); } });
  inp.addEventListener('blur', () => setTimeout(() => ul.hidden = true, 150));
  return {input: inp, disable(v){ inp.disabled = v; }};
}

// ---------- round end ----------
function endCard(host, {right, total, secs, misses, again, drill}){

    (misses.length ? `<div><p class="lab">To review</p><div class="chips">${misses.map(d => `<span class="chip off">${esc(d.n)}</span>`).join('')}</div></div>` : '') +
    `<div class="row"><button class="btn primary" type="button" data-a="again">New round</button>${misses.length ? '<button class="btn" type="button" data-a="drill">Drill the misses</button>' : ''}</div>`;

function timer(el){ const t0 = Date.now(); const iv = setInterval(() => { const s = (Date.now()-t0)/1000|0; el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 500); return {stop(){ clearInterval(iv); return (Date.now()-t0)/1000|0; }}; }

// ================= MODES =================

// ---- Find It ----
function modeFind(preset){
  const P = pool(); const items = preset || pickN('find', P, Math.min(10, P.length));
  panel.innerHTML = head('Find It', 'Tap the country on the map. Three tries, then we show you.', 'find', P) +
    `<div class="prompt"><small>Find</small><strong id="q"></strong></div>

     <div class="row"><button class="btn" id="skip" type="button">Show me</button></div><div id="endh"></div>`;
  let i = 0, tries = 0, right = 0, busy = false; const misses = []; const tm = timer($('#tm'));
  const map = makeMap(stage, {active:new Set(P.map(d => d.id)), onPick:pick});

    setTimeout(() => { map.cls(q.id,'reveal',false); map.cls(q.id,'meh'); map.reset(); busy = false; i++; ask(); }, 1700); }
  function pick(d){

      if (!tries){ right++; $('#sc').textContent = right; rec('find', q.id, true); toast('Yes, ' + q.n, 'good'); } else { misses.push(q); rec('find', q.id, false); toast(q.n); }

    endCard($('#endh'), {right, total:items.length, secs:tm.stop(), misses, again:() => route(), drill:m => { cleanup?.(); panel.innerHTML=''; stage.innerHTML=''; cleanup = modeFind(m); }}); }

}

// ---- Label It ----
function modeLabel(preset){
  const P = pool(); const items = preset || pickN('label', P, Math.min(8, P.length));
  const hard = S.diff === 'hard';
  panel.innerHTML = head('Label It', 'Drag each name onto its country, or tap a name and then tap the country.', 'label', P) +
    `<div class="tray" id="tray"></div><div class="stats"><span>Placed <b id="pl">0</b>/${items.length}</span><span>Misses <b id="ms">0</b></span><span>Time <b id="tm">0:00</b></span></div>
     <p class="note">${hard ? 'Hard: every country in the region is highlighted.' : 'Highlighted countries are the ones to label.'}</p><div id="endh"></div>`;
  const tm = timer($('#tm'));
  const act = new Set((hard ? P : items).map(d => d.id));
  let selected = null, placed = 0, missCount = 0; const missed = new Set();
  const tray = $('#tray');
  shuffle(items).forEach(d => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tag'; b.textContent = d.n; b._d = d; b.setAttribute('aria-pressed','false'); tray.appendChild(b); });
  const map = makeMap(stage, {active:act, onPick:(d) => { if (selected) check(selected, d); else toast('Tap a name first'); }});
  if (S.set === 'world' && H/W <= .7) map.focus(items, 2.2);
  function setSel(b){ tray.querySelectorAll('.tag').forEach(t => t.setAttribute('aria-pressed', t === b)); selected = b ? b._d : null; }
  function check(item, d){

  tray.addEventListener('pointercancel', () => { drag?.ghost?.remove(); drag = null; });

// ---- Shape (silhouette) ----
function bearing(a, b){ const r = Math.PI/180, [l1,p1] = [a[0]*r,a[1]*r], [l2,p2] = [b[0]*r,b[1]*r];
  const y = Math.sin(l2-l1)*Math.cos(p2), x = Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(l2-l1); return (Math.atan2(y,x)/r + 360) % 360; }
function modeShape(){
  const P = pool(); const target = pickN('shape', P, 1)[0]; const U = universe(S.set);
  const MAXD = S.set === 'us' ? 4600 : 20015, MAXG = 6;
  panel.innerHTML = head('Shape', `Name the ${S.set === 'us' ? 'state' : 'country'} from its outline. Six guesses. Each miss tells you how far and which way.`, 'shape', P) +
    `<div class="sil"><svg viewBox="0 0 240 240" aria-label="Mystery outline"><path id="silp"></path></svg></div>
     <div id="gin"></div><ul class="clues" id="cluelist"></ul><div class="rows" id="rows"></div>
     <p class="note">km = how far your guess is from the answer. The arrow points from your guess toward the answer. % = how close you are (100% is correct).</p>
     <div class="row"><button class="btn" id="hint" type="button">Clue</button><button class="btn" id="give" type="button">Reveal</button><button class="btn primary" id="nxt" type="button" hidden>Next shape</button></div><div id="endh"></div>`;
  const sp = d3.geoAzimuthalEqualArea().rotate([-target.cen[0], -target.cen[1]]).fitExtent([[14,14],[226,226]], target.ft);
  $('#silp').setAttribute('d', d3.geoPath(sp)(target.ft));
  const map = makeMap(stage, {});
  const guesses = []; let done = false, hints = 0;
  const rows = $('#rows');
  function draw(){
    rows.innerHTML = '<div class="grow headrow"><span>Guess</span><span>Away</span><span>Way</span><span>Close</span></div>' + guesses.map(g => { const win = g.id === target.id; const d = d3.geoDistance(g.pt, target.pt)*R; const b = bearing(g.pt, target.pt); const p = Math.round(Math.max(0, 1 - d/MAXD)*100);
      return `<div class="grow${win ? ' win' : ''}"><span class="nm">${esc(g.n)}</span><span class="num">${win ? '0' : fmt(d)} km</span><span class="arrow" style="transform:rotate(${b}deg)" aria-label="direction">${win ? '★' : '↑'}</span><span class="num">${win ? 100 : p}%</span></div>`; }).join('') +
      Array(Math.max(0, MAXG - guesses.length)).fill('<div class="grow empty"></div>').join('');
  }
  const gi = makeGuess($('#gin'), {placeholder: S.set === 'us' ? 'Type a state' : 'Type a country', items:() => U.filter(d => !guesses.includes(d)), onPick:g => {
    if (done) return; guesses.push(g); const d = d3.geoDistance(g.pt, target.pt)*R;
    map.fill(g.id, g.id === target.id ? 'var(--good-fill)' : d3.interpolateRgb('#ffe066','#e03131')(Math.max(0, 1 - d/(MAXD*.35)))); map.label(g, g.n);

  $('#hint').onclick = () => { if (hints >= CL.length) return; $('#cluelist').insertAdjacentHTML('beforeend', `<li>${esc(CL[hints])}</li>`); hints++; if (hints >= CL.length) $('#hint').disabled = true; };
  $('#give').onclick = () => end(false);
  $('#nxt').onclick = () => route();
  function end(win){ done = true; gi.disable(true); rec('shape', target.id, win && guesses.length <= 3 && hints === 0);
    map.cls(target.id, win ? 'ok' : 'reveal'); map.label(target, target.n, win ? '' : 'miss'); map.focus([target], 4);
    $('#hint').hidden = true; $('#give').hidden = true; $('#nxt').hidden = false;
    $('#endh').innerHTML = `<div class="end"><div class="score">${win ? `Got it in ${guesses.length}` : esc(target.n)}</div><p>${win ? esc(target.n) + '.' : 'That was the answer.'}${target.cap[0] ? ` Capital: ${esc(target.cap[0])}.` : ''}</p></div>`; }
  draw(); gi.input.focus({preventScroll:true});
}

// ---- Hot & Cold ----
const SAMPLES = new Map();
function samples(d){ if (SAMPLES.has(d.id)) return SAMPLES.get(d.id); const pts = [];
  (function walk(c){ if (typeof c[0] === 'number') pts.push(c); else c.forEach(walk); })(d.ft.geometry.coordinates);
  const step = Math.max(1, Math.ceil(pts.length/140)); const s = pts.filter((_,i) => i % step === 0); SAMPLES.set(d.id, s); return s; }
function gap(a, b){ if (a.id === b.id) return 0; if ((a.b0 || a.b)?.includes(b.id) || (b.b0 || b.b)?.includes(a.id)) return 0;
  const A = samples(a), B = samples(b); let m = Infinity; for (const p of A) for (const q of B){ const d = d3.geoDistance(p,q); if (d < m) m = d; } return m * R; }
function makeGlobe(host, {items, center=[0,20]}){
  fitH();

  const proj = d3.geoOrthographic().fitExtent([[20,20],[W-20,H-20]], {type:'Sphere'}).rotate([-center[0], -center[1]]).clipAngle(90);
  const s0 = proj.scale(); const path = d3.geoPath(proj);
  svg.append('rect').attr('class','water').attr('width',W).attr('height',H);
  const sph = svg.append('path').attr('class','sphere').datum({type:'Sphere'});
  const grat = svg.append('path').attr('class','grat').datum(d3.geoGraticule10());
  const fp = svg.append('g').selectAll('path').data(items, d => d.id).join('path').attr('class','f');
  const lab = svg.append('g'); const labels = new Map();
  function redraw(){ sph.attr('d', path); grat.attr('d', path); fp.attr('d', d => path(d.f));
    const r = proj.rotate(), c = [-r[0], -r[1]];
    const gpx = W / Math.max(1, svg.node().getBoundingClientRect().width || W);
    lab.selectAll('text').data([...labels.values()], d => d.d.id).join('text').attr('class', d => 'lbl ' + d.cls).attr('font-size', 14*gpx).attr('stroke-width', 3.5*gpx)
      .attr('display', d => d3.geoDistance(d.d.cen, c) < Math.PI/2 - .05 ? null : 'none')
      .attr('x', d => proj(d.d.cen)[0]).attr('y', d => proj(d.d.cen)[1]).text(d => d.t); }
  svg.call(d3.drag().on('drag', e => { const r = proj.rotate(), k = 70/proj.scale(); proj.rotate([r[0] + e.dx*k, Math.max(-85, Math.min(85, r[1] - e.dy*k))]); redraw(); }));
  svg.on('wheel', e => { e.preventDefault(); proj.scale(Math.max(s0*.8, Math.min(s0*8, proj.scale() * (e.deltaY < 0 ? 1.12 : 1/1.12)))); redraw(); }, {passive:false});
  const zc = document.createElement('div'); zc.className = 'zoomctl';
  zc.innerHTML = '<button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button>';
  zc.children[0].onclick = () => { proj.scale(Math.min(s0*8, proj.scale()*1.5)); redraw(); };
  zc.children[1].onclick = () => { proj.scale(Math.max(s0*.8, proj.scale()/1.5)); redraw(); };
  host.appendChild(zc);
  redraw();
  return {

// ---- Border Chain ----
function bfs(src, ids){ const dist = new Map([[src.id, 0]]), q = [src]; while (q.length){ const d = q.shift(); for (const n of d.b || []){ const nd = BY.get(n); if (!nd || (ids && !ids.has(n)) || dist.has(n)) continue; dist.set(n, dist.get(d.id) + 1); q.push(nd); } } return dist; }
function modeChain(){
  const U = universe(S.set); const P = pool().filter(d => d.b && d.b.length);
  const [lo, hi] = {easy:[2,3], medium:[3,5], hard:[4,7]}[S.diff];
  let A, B, dA, D;
  for (let t = 0; t < 80; t++){ A = pickN('chain', P, 1)[0]; dA = bfs(A); const cand = P.filter(d => { const x = dA.get(d.id); return x >= lo && x <= hi; }); if (cand.length){ B = cand[Math.random()*cand.length|0]; break; } }
  if (!B){ panel.innerHTML = head('Border Chain','Not enough land borders in this map at this level. Try a bigger region or another difficulty.'); return; }
  D = dA.get(B.id); const dB = bfs(B);
  const path0 = [A]; let cur = A; while (cur.id !== B.id){ cur = BY.get(cur.b.find(n => dA.get(n) === dA.get(cur.id)+1 && dB.get(n) === D - dA.get(cur.id) - 1)); path0.push(cur); }
  const MAXG = D - 1 + 4;
  const tapOK = S.diff === 'easy';
  panel.innerHTML = head('Border Chain', `Connect the two ${S.set === 'us' ? 'states' : 'countries'} through shared land borders. Shortest chain needs ${D-1} in between.${tapOK ? ' On Easy you can also tap the map.' : ''}`, 'chain', P) +
    `<div class="chainhead">${esc(A.n)} <span>to</span> ${esc(B.n)}</div>
     <div id="gin"></div><div class="stats"><span>Guesses <b id="gc">0</b>/${MAXG}</span><span>Best <b>${D-1}</b></span></div>
     <div class="chips" id="gl"></div><p class="note">Green is on a shortest route. Orange still borders things but takes the long way.</p>
     <div class="row"><button class="btn" id="hint" type="button">Hint (costs a guess)</button><button class="btn" id="give" type="button">Show route</button><button class="btn" id="nxt" type="button" hidden>New chain</button></div><div id="endh"></div>`;
  const guessed = []; let done = false, used = 0; let map;
  function onPath(d){ return dA.get(d.id) + dB.get(d.id) === D; }
  function linked(){ const ids = new Set([A.id, B.id, ...guessed.map(d => d.id)]); return bfs(A, ids).has(B.id); }
  function draw(){ $('#gc').textContent = used; $('#gl').innerHTML = guessed.map(d => `<span class="chip ${onPath(d) ? 'on' : 'off'}${d._h ? ' hintc' : ''}">${esc(d.n)}</span>`).join(''); }
  function guess(d, viaHint){
    if (done || d.id === A.id || d.id === B.id || guessed.includes(d)) return;
    d._h = !!viaHint; guessed.push(d); used++;
    map.cls(d.id, onPath(d) ? 'ok' : 'meh'); map.label(d, d.n); draw();
    if (linked()) end(true); else if (used >= MAXG) end(false);
  }
  const gi = makeGuess($('#gin'), {placeholder: S.set === 'us' ? 'Type a state' : 'Type a country', items:() => U.filter(d => !guessed.includes(d) && d !== A && d !== B), onPick:d => guess(d)});
  map = makeMap(stage, {fit:path0, onPick: tapOK ? (d => guess(d)) : null, active: tapOK ? new Set(U.filter(d => d.type === 'state' || (d.sov && d.b.length)).map(d => d.id)) : new Set()});
  map.cls(A.id, 'endpt'); map.cls(B.id, 'endpt'); map.label(A, A.n, 'end'); map.label(B, B.n, 'end');
  $('#hint').onclick = () => { const n = path0.slice(1,-1).find(d => !guessed.includes(d)) || U.find(d => onPath(d) && !guessed.includes(d) && d !== A && d !== B); if (n) guess(n, true); };
  $('#give').onclick = () => end(false); $('#nxt').onclick = () => route();
  function end(win){ done = true; gi.disable(true); rec('chain', A.id, win && used <= D+1);
    if (!win) path0.slice(1,-1).forEach(d => { if (!guessed.includes(d)){ map.cls(d.id,'reveal'); map.label(d, d.n, 'miss'); } });
    ['hint','give'].forEach(id => $('#'+id).hidden = true); $('#nxt').hidden = false;
    $('#endh').innerHTML = `<div class="end"><div class="score">${win ? (used === D-1 ? 'Perfect chain' : `Linked in ${used}`) : 'Route shown'}</div><p>One shortest route: ${path0.map(d => esc(d.n)).join(' → ')}.</p></div>`; }
  draw();
}

// ---- shared Q&A engine for Capitals and Flags ----
// Tricky answer choices for Capitals: the place's own big cities, plus capitals of
// same-language and nearby places. Madrid comes with Barcelona, Lisbon and Buenos Aires.
function nearestTo(q, src, n, filt = () => true){
  return src.filter(d => d !== q && filt(d)).sort((a,b) => d3.geoDistance(a.pt, q.pt) - d3.geoDistance(b.pt, q.pt)).slice(0, n);
}
const sameLang = (a, b) => (a.lang || []).some(l => (b.lang || []).includes(l));
function capChoices(q){
  const src = q.type === 'state' ? US : C.filter(d => d.sov && d.cap?.length);
  const opts = [{html:esc(q.cap[0]), ok:true}], seen = new Set(q.cap.map(norm));
  const add = s => { if (s && opts.length < 4 && !seen.has(norm(s))){ seen.add(norm(s)); opts.push({html:esc(s), ok:false}); } };
  const nCity = S.diff === 'easy' ? 1 : (q.type === 'state' || Math.random() < .5 ? 2 : 1);
  (q.big || []).slice(0, nCity).forEach(add);
  if (q.type === 'country'){ const L = shuffle(nearestTo(q, src, 4, d => sameLang(d, q))); if (L.length) add(L[0].cap[0]); }
  shuffle(nearestTo(q, src, 5)).forEach(d => add(d.cap[0]));
  nearestTo(q, src, 20).forEach(d => add(d.cap[0]));
  return shuffle(opts);
}
function placeChoices(q){
  const src = q.type === 'state' ? US : C.filter(d => d.sov);
  const opts = [q];
  const add = d => { if (d && opts.length < 4 && !opts.includes(d)) opts.push(d); };
  if (q.type === 'country') shuffle(nearestTo(q, src, 4, d => sameLang(d, q))).slice(0, 1).forEach(add);
  shuffle(nearestTo(q, src, 5)).forEach(add);
  nearestTo(q, src, 20).forEach(add);
  return shuffle(opts.map(d => ({html:esc(d.n), ok:d === q})));
}
function distract(q, n, src, key){
  const same = shuffle(src.filter(d => d !== q && (q.type === 'state' || d.r === q.r) && key(d) && key(d) !== key(q)));
  const rest = shuffle(src.filter(d => d !== q && !same.includes(d) && key(d)));
  const out = []; for (const d of [...same, ...rest]){ if (out.length >= n) break; if (!out.some(o => key(o) === key(d))) out.push(d); } return out;
}
function quizRound({mode, title, how, items, P, askHTML, choicesFor, typed, typedItems, check, onShow, after, redo}){

  function drawAll(){
    const p = baseProj(), path = d3.geoPath(p);
    gSph.attr('d', path({type:'Sphere'})); gGrat.attr('d', path(d3.geoGraticule10()));
    gC.selectAll('path').data(C, d => d.id).join('path').attr('class', d => 'f act' + (d.id === A.base ? ' base' : '') + (d.id === A.info ? ' sel' : '')).attr('d', d => path(d.f))
      .on('click', (e,d) => { A.info = d.id; save(); showInfo(); drawAll(); });
    gS.selectAll('path').data(A.base === 'USA' ? US : [], d => d.id).join('path').attr('class','stl').attr('d', d => path(d.f));
    const o = BY.get(A.ov); const op = d3.geoAzimuthalEqualArea().rotate([-o.cen[0], -o.cen[1]]).scale(p.scale()).translate([0,0]).clipAngle(90);
    const opath = d3.geoPath(op); ovp.attr('d', opath(o.ft)); const bb = opath.bounds(o.ft); const apx = W / Math.max(1, svg.node().getBoundingClientRect().width || W);
    ovt.text(o.n).attr('x', 0).attr('y', Math.min(bb[0][1] - 10*apx, -12)).attr('font-size', 17*apx).attr('stroke-width', 4*apx);
    place(); verdict();
    $('#rot').value = A.rot; $('#rotv').textContent = A.rot + '°'; $('#zm').value = Math.round(A.zoom*100); $('#zmv').textContent = Math.round(A.zoom*100) + '%';
  }
  function place(){ ov.attr('transform', `translate(${A.x},${A.y}) rotate(${A.rot})`); ovt.attr('transform', `rotate(${-A.rot})`); }
  function verdict(){ const o = BY.get(A.ov), b = BY.get(A.base); const r = o.garea / b.garea;
    let s = r >= 1 ? `<b>${esc(o.n)}</b> is <b>${r.toFixed(r < 10 ? 2 : 0)}×</b> the size of ${esc(b.n)}.` : `<b>${esc(o.n)}</b> is <b>${(r*100).toFixed(r < .01 ? 2 : 0)}%</b> the size of ${esc(b.n)}.`;
    const st = US.slice().sort((x,y) => Math.abs(Math.log(o.garea/x.garea)) - Math.abs(Math.log(o.garea/y.garea)))[0];
    if (o.type === 'country') s += ` Closest US state in size: ${esc(st.n)} (${(o.garea/st.garea).toFixed(2)}×).`;
    $('#verdict').innerHTML = s; }
  function showInfo(){ $('#info').innerHTML = infoHTML(BY.get(A.info)) + `<div class="row" style="margin-top:8px"><button class="btn" type="button" id="useov">Use as overlay</button><button class="btn" type="button" id="usebase">Use as base</button></div>`;
    $('#useov').onclick = () => { A.ov = A.info; A.x = W/2; A.y = H/2; A.rot = 0; save(); fitZoom(); drawAll(); setPH(); };
    $('#usebase').onclick = () => { if (BY.get(A.info).type !== 'country') return; A.base = A.info; save(); fitZoom(); drawAll(); setPH(); };
    $('#info').querySelectorAll('.chip[data-id]').forEach(b => b.onclick = () => { A.info = b.dataset.id; save(); showInfo(); drawAll(); }); }
  $('#rot').oninput = e => { A.rot = +e.target.value; $('#rotv').textContent = A.rot + '°'; place(); };
  $('#zm').oninput = e => { const nz = +e.target.value/100, k = nz/A.zoom; A.x = W/2 + (A.x - W/2)*k; A.y = H/2 + (A.y - H/2)*k; A.zoom = nz; drawAll(); };
  $('#ctr').onclick = () => { A.x = W/2; A.y = H/2; place(); };
  $('#swap').onclick = () => { if (BY.get(A.ov).type !== 'country') return toast('Base must be a country'); [A.ov, A.base] = [A.base, A.ov]; A.x = W/2; A.y = H/2; save(); fitZoom(); drawAll(); setPH(); };
  const pt = e => { const p = svg.node().createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.node().getScreenCTM().inverse()); };
  let dr = null;
  ov.on('pointerdown', e => { const p = pt(e); dr = {dx:p.x - A.x, dy:p.y - A.y}; ov.classed('drag', true); ov.node().setPointerCapture(e.pointerId); e.stopPropagation(); });
  ov.on('pointermove', e => { if (!dr) return; const p = pt(e); A.x = p.x - dr.dx; A.y = p.y - dr.dy; place(); });
  ov.on('pointerup pointercancel', () => { dr = null; ov.classed('drag', false); });
  ov.on('keydown', e => { const s = e.shiftKey ? 30 : 8, k = {ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key]; if (!k) return; e.preventDefault(); A.x += k[0]; A.y += k[1]; place(); });
  fitZoom(); drawAll(); showInfo();
}

// ---- Players scoreboard ----
const BOARD = [['find','Find It'],['label','Label It'],['shape','Shape'],['hot','Hot & Cold'],['chain','Chains'],['cap-c2cap','Capitals'],['flag-flag2c','Flags']];
function modePlayers(){
  const items = universe(S.set).filter(d => inSet(d, S.set));
  const all = PLAYERS.map(p => { const st = store.get('aa-stats:' + p, {});
    const kn = m => items.filter(d => { const v = st[m+':'+d.id]; return v && v[0] >= 2 && v[0] > v[1]; }).length;
    const cols = BOARD.map(([m]) => m === 'chain' ? Object.keys(st).filter(k => k.startsWith('chain:') && st[k][0] > 0).length : kn(m));
    const ans = Object.values(st).reduce((a,v) => a + v[0] + v[1], 0), right = Object.values(st).reduce((a,v) => a + v[0], 0);
    return {p, cols, total:cols.reduce((a,b) => a+b, 0), ans, acc: ans ? Math.round(right/ans*100) : 0}; });
  const best = BOARD.map((_,i) => Math.max(...all.map(r => r.cols[i])));
  const top = Math.max(...all.map(r => r.total));
  all.sort((a,b) => b.total - a.total);
  panel.innerHTML = head('Players', `Who knows ${esc(SETS[S.set])} best. "Known" means answered right at least twice and more often than missed. Chains counts chains solved.`) +
    `<div class="row"><button class="btn primary" type="button" id="addp">Add player</button></div>
     <div><p class="lab">Playing as</p><div class="chips">${PLAYERS.map(p => `<button type="button" class="chip${p === S.player ? ' on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
     <p class="note">Progress is saved in this browser. Each device keeps its own players.</p>`;
  $('#addp').onclick = () => renderPlayers(true);
  panel.querySelectorAll('[data-p]').forEach(b => b.onclick = () => switchPlayer(b.dataset.p));
  stage.style.background = 'var(--panel)'; stage.style.overflow = 'auto';
  stage.innerHTML = `<div style="padding:16px" class="scroll"><table class="board"><thead><tr><th>Player</th>${BOARD.map(b => `<th>${b[1]}</th>`).join('')}<th>Total</th><th>Accuracy</th></tr></thead><tbody>${
    all.map(r => `<tr class="${r.p === S.player ? 'me' : ''}"><td>${esc(r.p)}${r.total === top && top > 0 ? ' ★' : ''}</td>${r.cols.map((c,i) => `<td class="${c === best[i] && c > 0 ? 'lead' : ''}">${c}</td>`).join('')}<td>${r.total}</td><td>${r.ans ? r.acc + '%' : '–'}</td></tr>`).join('')
  }</tbody></table><p class="note" style="margin-top:12px">Out of ${items.length} ${S.set === 'us' ? 'states' : 'countries'} per column at the current map. Switch the map above to compare another region.</p></div>`;
  return () => { stage.style.background = ''; stage.style.overflow = ''; };
}

// ---------- boot ----------
shell();
Promise.all(['data/world.json','data/states.json'].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); })))
  .then(([w, s]) => {
    C = w.map(d => prep(d, 'country')).sort((a,b) => a.n.localeCompare(b.n));
    US = s.map(d => prep(d, 'state')).sort((a,b) => a.n.localeCompare(b.n));
    route();
  })
  .catch(err => { panel.innerHTML = `<p>Could not load the map data (${esc(err.message)}). Reload the page to try again.</p>`; });
</script>
</body>
