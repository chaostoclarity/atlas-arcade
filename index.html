<html lang="en">
<head>
<!--pwa-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b59c3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Geography games for the whole family: find countries, label maps, shapes, borders, capitals and flags.">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<!--/pwa-->
<title>Atlas Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: classroom pull-down map turned arcade. Header + mode rail, then a control panel beside a big map stage (stacks on phones). */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#0f1d2b; --muted:#5a6a7a; --line:#dde4eb; --line-strong:#c5d1dc;
  --space:#e4ebf2; --water:#94c9e6; --sphere:#94c9e6; --ocean-edge:#6fb0d6;
  --ctx:#e3e7ec; --stroke:#ffffff; --coast:#5d8fb0;
  --p0:#f7e3a1; --p1:#f6c6a2; --p2:#c5e3b1; --p3:#d8c8ec; --p4:#f3c2d2; --p5:#e6d3b3;
  --act:#f7e3a1; --act-hover:#ffd84d;
  --accent:#2952c4; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --good:#2b8a3e; --good-fill:#51cf66; --bad:#d6336c; --bad-fill:#ff8fab; --hint:#e8590c; --hint-fill:#ffa94d;
  --halo:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141b; --panel:#141f29; --ink:#e6eef3; --muted:#93a5b2; --line:#24333f; --line-strong:#34485a;
  --space:#0a1219; --water:#123a55; --sphere:#123a55; --ocean-edge:#1b4b6b;
  --ctx:#27323c; --stroke:#0d1720; --coast:#3a6f93;
  --p0:#6d6233; --p1:#71503b; --p2:#3e6446; --p3:#53476e; --p4:#6d4153; --p5:#625440;
  --act:#6d6233; --act-hover:#9a8a2c;
  --accent:#7ea4ff; --accent-ink:#0a1430; --accent-soft:#1c2c52;
  --good:#69db7c; --good-fill:#2f9e44; --bad:#ff8ab0; --bad-fill:#c2255c; --hint:#ffc078; --hint-fill:#e8590c;
  --halo:#0c141b; --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141b; --panel:#141f29; --ink:#e6eef3; --muted:#93a5b2; --line:#24333f; --line-strong:#34485a;
  --space:#0a1219; --water:#123a55; --sphere:#123a55; --ocean-edge:#1b4b6b;
  --ctx:#27323c; --stroke:#0d1720; --coast:#3a6f93;
  --p0:#6d6233; --p1:#71503b; --p2:#3e6446; --p3:#53476e; --p4:#6d4153; --p5:#625440;
  --act:#6d6233; --act-hover:#9a8a2c;
  --accent:#7ea4ff; --accent-ink:#0a1430; --accent-soft:#1c2c52;
  --good:#69db7c; --good-fill:#2f9e44; --bad:#ff8ab0; --bad-fill:#c2255c; --hint:#ffc078; --hint-fill:#e8590c;
  --halo:#0c141b; --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{max-width:1320px;margin:0 auto;grid-template-columns:minmax(0,1fr);padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,32px);margin:0;letter-spacing:-.02em;line-height:1}
.brand h1 em{font-style:normal;color:var(--accent)}
.globe-mark{width:30px;height:30px;flex:none}
.pickers{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.who{display:flex;align-items:center;gap:8px}
.pickers.off{display:none}
select{padding:7px 30px 7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who select{font-weight:700}
.who input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);width:150px}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th,.board td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.board th:first-child,.board td:first-child{text-align:left}
.board th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.board td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.board td:first-child{font-family:var(--body);font-weight:700}
.board tr.me td{background:var(--accent-soft)}
.board td.lead{color:var(--good);font-weight:600}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s,color .15s}
.tab svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow);align-content:start}
.panel h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1.1}
.how{margin:2px 0 0;color:var(--muted);font-size:14px}
.meter{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.meter .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--good)}
.prompt{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.prompt small{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.prompt strong{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.1;text-wrap:balance}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;height:min(64vh,640px);background:var(--space);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.stage:has(.lay-satellite),.stage:has(.lay-terrain){background:#0b1724}
svg.map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.water{fill:var(--space)}
.map.us .water{fill:var(--water)}
.sphere{fill:var(--sphere);stroke:var(--ocean-edge);stroke-width:1.5;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:#ffffff;stroke-width:.6;vector-effect:non-scaling-stroke;opacity:.28}
.f{fill:var(--ctx);stroke:var(--stroke);stroke-width:.9;vector-effect:non-scaling-stroke;transition:fill .2s,fill-opacity .2s}
.f.c0{fill:var(--p0)}.f.c1{fill:var(--p1)}.f.c2{fill:var(--p2)}.f.c3{fill:var(--p3)}.f.c4{fill:var(--p4)}.f.c5{fill:var(--p5)}
.f.off,.map.plain .f{fill:var(--ctx)}
.f.act{cursor:pointer}
.f.act:hover{fill:var(--act-hover)}
.f.sel,.dot.sel{fill:var(--accent)}
.f.ok,.dot.ok{fill:var(--good-fill)}
.f.meh,.dot.meh{fill:var(--hint-fill)}
.f.bad,.dot.bad{fill:var(--bad-fill)}
.f.reveal,.dot.reveal{fill:var(--hint-fill);stroke:var(--hint);stroke-width:2}
.f.base{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.f.endpt,.dot.endpt{fill:var(--accent);stroke:var(--accent)}
.stl{fill:none;stroke:var(--coast);stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.8}
.dot{fill:#ffffff;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.lbl{font-family:var(--body);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.lbl.end{fill:var(--accent)}
.lbl.miss{fill:var(--hint)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.toast.good{border-color:var(--good);color:var(--good)}
.zoomctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.hint-line{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:6px;opacity:.92;pointer-events:none}
/* guess input */
.guess{position:relative}
.guess input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.guess ul{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.guess li{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.guess li small{color:var(--muted)}
.guess li[aria-selected="true"],.guess li:hover{background:var(--accent-soft)}
/* choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 10px;cursor:pointer;font-weight:600;text-align:left;min-height:48px}
.choice:hover{border-color:var(--accent)}
.choice.ok{background:var(--good-fill);border-color:var(--good)}
.choice.bad{background:var(--bad-fill);border-color:var(--bad)}
.choice.flag{padding:8px;display:grid;place-items:center}
.choice.flag img{width:100%;max-width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.bigflag{width:100%;max-width:260px;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);justify-self:center;background:var(--bg)}
/* label tray */
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:grab;font-weight:700;touch-action:none;user-select:none}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-style:solid}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 10px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
/* guess rows */
.rows{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.grow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.grow .arrow{display:inline-block;font-size:18px;line-height:1;color:var(--accent)}
.grow.win{background:var(--good-fill)}
.grow .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.grow.empty{opacity:.45;min-height:34px}
.sil{background:var(--bg);border-radius:10px;display:grid;place-items:center;padding:8px}
.sil svg{width:100%;max-width:240px;height:auto}
.sil path{fill:var(--ink)}
.chainhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:22px}
.chainhead span{color:var(--muted);font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--bg);font-weight:600}
.chip.on{background:var(--good-fill);border-color:var(--good)}
.chip.off{background:var(--hint-fill);border-color:var(--hint)}
.chip.hintc{border-style:dashed}
button.chip{cursor:pointer}
.end{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.end .score{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.end p{margin:0;color:var(--muted)}
.info{display:grid;gap:10px}
.info .head{display:flex;gap:12px;align-items:center}
.info .head img{width:64px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.info h3{font-family:var(--display);font-weight:800;font-size:22px;margin:0;line-height:1.1}
.info .off{color:var(--muted);font-size:13px}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:62px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.ctl output{font-family:var(--mono);text-align:right;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px}
.verdict{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.verdict b{color:var(--accent)}
#ov{cursor:grab}
#ov.drag{cursor:grabbing}
#ov path{fill:color-mix(in srgb,var(--bad) 32%,transparent);stroke:var(--bad);stroke-width:1.8;vector-effect:non-scaling-stroke}
#ov text{font-family:var(--display);font-weight:800;fill:var(--bad);text-anchor:middle;paint-order:stroke;stroke:var(--halo);pointer-events:none}
.note{font-size:12.5px;color:var(--muted);margin:0}
.map.lay-raster .sphere{fill:#0b1a2a}
.map.lay-raster .water{fill:#0b1724}
.map.lay-raster .grat{opacity:.15}
.map.lay-raster .f{fill-opacity:0;stroke:rgba(255,255,255,.8);stroke-width:.9}
.map.lay-terrain .f{stroke:rgba(40,32,22,.6)}
.map.lay-raster .f.off{fill:#0b1a2a;fill-opacity:.45}
.map.lay-raster .f.act:hover{fill:#ffffff;fill-opacity:.35}
.map.lay-raster .f.ok,.map.lay-raster .f.meh,.map.lay-raster .f.bad,.map.lay-raster .f.reveal,.map.lay-raster .f.sel,.map.lay-raster .f.endpt,.map.lay-raster .f.base,.map.lay-raster .f[style*="fill"]{fill-opacity:.72}
.map.lay-raster .stl{stroke:rgba(255,255,255,.55)}
.map.lay-satellite .lbl{fill:#ffffff;stroke:rgba(0,0,0,.75)}
.map.lay-satellite .lbl.nm{fill:#e9eef3}
.layerctl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:2}
.layerctl button{border:0;background:none;border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.layerctl button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.layerctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.layerctl.busy::after{content:"";position:absolute;right:-26px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.helpbtn{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--accent);background:var(--panel);color:var(--accent);font-family:var(--display);font-weight:800;font-size:20px;cursor:pointer;line-height:1}
.helpbtn:hover{background:var(--accent);color:var(--accent-ink)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,16,24,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--panel);color:var(--ink);border-radius:18px;padding:22px 22px 20px;max-width:520px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);display:grid;gap:10px}
.modal h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1}
.modal .goal{margin:0;font-size:18px;font-weight:600;color:var(--accent)}
.modal ol{margin:4px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:17px;line-height:1.45}
.modal .btn{width:100%;min-height:52px;font-size:18px}
.lbl.nm{font-weight:600;fill:var(--muted)}
.map.plain .f{fill:#f3f4f0;stroke:#d3d8dd}
.map.plain .sphere,.map.plain.us .water{fill:#cfe3ee}
.nf .pg{vector-effect:non-scaling-stroke;stroke-width:1.6;cursor:pointer}
.n-sea .pg{fill:#1971c2;fill-opacity:.32;stroke:#ffffff;stroke-opacity:.7;stroke-width:1}
.n-sea.ocean .pg{fill-opacity:.05;stroke:none}
.map.lay-raster .n-sea .pg{fill:#4dabf7;fill-opacity:.45;stroke:#ffffff;stroke-opacity:.9}
.map.lay-raster .n-sea.ocean .pg{fill-opacity:.08}
.n-lake .pg{fill:#1c7ed6;fill-opacity:1;stroke:#ffffff;stroke-width:1.4}
.n-desert .pg{fill:#f2a541;fill-opacity:.75;stroke:#b8600a}
.n-land .pg{fill:#2fb344;fill-opacity:.55;stroke:#1f7a2e}
.n-mountain .pg{fill:#8b5a2b;fill-opacity:.72;stroke:#4f300f}
.n-island .pg{fill:#c04ce0;fill-opacity:.5;stroke:#7d1fa0;stroke-width:2}

<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="globe-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><path d="M2 16h28M16 2c-5 5-5 23 0 28M16 2c5 5 5 23 0 28M5 8.5c6 3 16 3 22 0M5 23.5c6-3 16-3 22 0" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/></svg>
      <h1>Atlas <em>Arcade</em></h1>
    </div>
    <div class="pickers" id="pickers">
      <label for="set" class="lab" style="margin:0">Map</label>
      <select id="set"></select>
      <div class="seg" id="diff" role="group" aria-label="Difficulty"></div>
    </div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Game modes"></nav>
  <main class="main">
    <section class="panel" id="panel"><div class="loading">Loading the world…</div></section>
    <section class="stage" id="stage"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const R = 6371.0088, KM2MI = 0.386102, W = 960;
let H = 600;
// Size the map's drawing box to the stage it lands in, so it fills portrait and landscape screens alike.
function fitH(){ const r = document.getElementById('stage')?.getBoundingClientRect(); if (r && r.width > 50 && r.height > 50) H = Math.round(Math.max(380, Math.min(1500, W * r.height / r.width))); }
const MODES = [
  {id:'atlas', name:'Atlas', sub:'True size + facts'},
  {id:'find', name:'Find It', sub:'Tap the country'},
  {id:'label', name:'Label It', sub:'Place the names'},
  {id:'shape', name:'Shape', sub:'Guess the outline'},
  {id:'hot', name:'Hot & Cold', sub:'Close in on it'},
  {id:'chain', name:'Border Chain', sub:'Link two places'},
  {id:'capitals', name:'Capitals', sub:'Cities and countries'},
  {id:'flags', name:'Flags', sub:'Know the colors'},
  {id:'nature', name:'Nature', sub:'Rivers, peaks, seas'},
  {id:'trivia', name:'Trivia', sub:'Sunset Trivia questions'},
  {id:'players', name:'Players', sub:'Scoreboard'},
];
const ICON = {
  atlas:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18"/>',
  find:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  label:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  shape:'<path d="M5 8l5-4 4 3 5-1-1 6 2 4-6 4-4-2-5 1 1-5z"/>',
  hot:'<path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-9z"/>',
  chain:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  capitals:'<path d="M4 21h16M5 21V10l7-5 7 5v11M9 21v-6h6v6"/>',
  flags:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
  nature:'<path d="M2 20l7-12 4 6 3-4 6 10z"/><path d="M8.5 9l1.5 2"/>',
  trivia:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
  players:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>'
};
const SETS = {world:'World',africa:'Africa',asia:'Asia',europe:'Europe',namerica:'North & Central America',samerica:'South America',oceania:'Oceania',us:'US States'};
const BOX = {africa:[-19,-36,52,38],asia:[26,-10,146,55],europe:[-25,34,45,71],namerica:[-168,6,-52,72],samerica:[-82,-56,-34,13],oceania:[112,-48,180,-1]};
// Difficulty = how well known a place is, not how big it is.
// Easy: household names. Medium: places most adults have heard of. Hard: everything else.
const EASY = new Set('USA CAN MEX BRA ARG CHL PER COL VEN CUB JAM GBR IRL FRA DEU ITA ESP PRT NLD BEL CHE AUT GRC POL SWE NOR FIN DNK ISL RUS UKR TUR EGY ZAF NGA KEN ETH MAR MDG IND CHN JPN KOR PRK VNM THA PHL IDN PAK AFG IRN IRQ SAU ISR AUS NZL'.split(' '));
const MED = new Set('HUN CZE SVK ROU BGR SRB HRV BIH SVN ALB EST LVA LTU BLR GEO ARM AZE KAZ UZB MNG LUX MLT MCO VAT CYP KWT QAT ARE OMN YEM JOR LBN SYR PSE MYS SGP KHM LAO MMR NPL BGD LKA TWN DZA TUN LBY SDN SOM TZA UGA RWA GHA SEN CIV CMR COD AGO ZMB ZWE MOZ NAM BWA BOL ECU URY PRY GTM HND NIC CRI PAN SLV DOM HTI BHS PNG FJI'.split(' '));
const US_EASY = new Set('CA TX FL NY AK HI WA OR AZ NV CO IL MI MA GA LA'.split(' '));
const US_MED = new Set('PA OH NC VA NJ TN MN WI NM MT UT MO KY AL SC ID MD OK'.split(' '));
const tier = d => d.type === 'state' ? (US_EASY.has(d.id) ? 1 : US_MED.has(d.id) ? 2 : 3) : (EASY.has(d.id) ? 1 : MED.has(d.id) ? 2 : 3);

// ---------- storage ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const S = Object.assign({set:'world', diff:'medium', capDir:'c2cap', flagDir:'flag2c', player:'Player 1', natFmt:'find', natType:'all', layer:'map', trivCat:'both'}, store.get('aa-prefs', {}));
let PLAYERS = store.get('aa-players', null);
if (!PLAYERS){ PLAYERS = ['Player 1']; const old = store.get('aa-stats', null); if (old) store.set('aa-stats:Player 1', old); store.set('aa-players', PLAYERS); }
if (!PLAYERS.includes(S.player)) S.player = PLAYERS[0];
let ST = store.get('aa-stats:' + S.player, {});
const saveS = () => store.set('aa-prefs', {set:S.set, diff:S.diff, capDir:S.capDir, flagDir:S.flagDir, player:S.player, natFmt:S.natFmt, natType:S.natType, layer:S.layer, trivCat:S.trivCat});
function rec(mode, id, ok){ const k = mode+':'+id, v = ST[k] || [0,0]; ok ? v[0]++ : v[1]++; ST[k] = v; store.set('aa-stats:' + S.player, ST); }
function switchPlayer(name){ S.player = name; ST = store.get('aa-stats:' + name, {}); saveS(); renderPlayers(); route(); }
function weight(mode, id){ const v = ST[mode+':'+id]; return v ? Math.min(3, Math.max(.3, 1 + v[1] - .5*v[0])) : 1.5; }
const RECENT = {};
function known(mode, arr){ return arr.filter(d => { const v = ST[mode+':'+d.id]; return v && v[0] >= 2 && v[0] > v[1]; }).length; }
// Weighted random draw: missed places come up more often, but never every time, and recent ones sit out.
function pickN(mode, arr, n){
  const pool = arr.slice(), out = [], recent = RECENT[mode] || [];
  const room = pool.length > recent.length + n;
  while (out.length < n && pool.length){
    const ws = pool.map(d => weight(mode, d.id) * (room && recent.includes(d.id) ? .02 : 1));
    let r = Math.random() * ws.reduce((a,b) => a+b, 0), i = 0;
    while (i < ws.length - 1 && (r -= ws[i]) > 0) i++;
    out.push(pool.splice(i,1)[0]);
  }
  RECENT[mode] = [...out.map(d => d.id), ...recent].slice(0, Math.min(15, Math.floor(arr.length/2)));
  return out;
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const close = (a,b) => { a = norm(a); b = norm(b); return a === b || (b.length > 4 && lev(a,b) <= (b.length > 8 ? 2 : 1)); };
const fmt = n => n >= 100 ? Math.round(n).toLocaleString() : n.toLocaleString(undefined,{maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- data ----------
let C = [], US = [], BY = new Map();
function trim(f){
  const g = f.geometry; if (g.type !== 'MultiPolygon') return f;
  const ps = g.coordinates.map(c => { const p = {type:'Polygon',coordinates:c}; return {c, a:d3.geoArea(p), cen:d3.geoCentroid(p)}; });
  const main = ps.reduce((a,b) => b.a > a.a ? b : a);
  const keep = ps.filter(p => d3.geoDistance(p.cen, main.cen) * 180/Math.PI <= 30);
  return {type:'Feature', geometry:{type:'MultiPolygon', coordinates:keep.map(p => p.c)}};
}
function prep(d, type){
  d.type = type; d.f = {type:'Feature', id:d.id, geometry:d.g};
  d.ft = trim(d.f); d.cen = d3.geoCentroid(d.ft);
  d.garea = d3.geoArea(d.ft) * R * R;
  if (type === 'state') d.a = d3.geoArea(d.f) * R * R;
  d.pt = (type === 'country' && d.ll2) ? [d.ll2[1], d.ll2[0]] : d.cen;
  BY.set(d.id, d); return d;
}
const universe = set => set === 'us' ? US : C;
function inRegion(d, set){
  if (set === 'world') return true;
  if (set === 'africa') return d.r === 'Africa';
  if (set === 'asia') return d.r === 'Asia';
  if (set === 'europe') return d.r === 'Europe';
  if (set === 'oceania') return d.r === 'Oceania';
  if (set === 'samerica') return d.sr === 'South America';
  if (set === 'namerica') return ['North America','Central America','Caribbean'].includes(d.sr);
}
function inSet(d, set){
  if (set === 'us') return d.type === 'state';
  if (d.type !== 'country' || !d.sov) return false;
  if (set === 'world') return true;
  if (set === 'africa') return d.r === 'Africa';
  if (set === 'asia') return d.r === 'Asia';
  if (set === 'europe') return d.r === 'Europe';
  if (set === 'oceania') return d.r === 'Oceania';
  if (set === 'samerica') return d.sr === 'South America';
  if (set === 'namerica') return ['North America','Central America','Caribbean'].includes(d.sr);
}
function pool(set = S.set, diff = S.diff){
  const all = universe(set).filter(d => inSet(d, set));
  // Medium includes Easy, Hard includes everything. Small regions borrow from the next level so a round has enough places.
  let lvl = {easy:1, medium:2, hard:3}[diff], out = all.filter(d => tier(d) <= lvl);
  while (out.length < 6 && lvl < 3){ lvl++; out = all.filter(d => tier(d) <= lvl); }
  return out;
}

// ---------- shell ----------
const $ = s => document.querySelector(s);
const panel = $('#panel'), stage = $('#stage');
function shell(){
  $('#set').innerHTML = Object.entries(SETS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  $('#set').value = S.set;
  $('#set').onchange = e => { S.set = e.target.value; saveS(); route(); };
  $('#diff').innerHTML = ['easy','medium','hard'].map(d => `<button type="button" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('');
  $('#diff').onclick = e => { const d = e.target.dataset.d; if (!d) return; S.diff = d; saveS(); route(); };
  $('#tabs').innerHTML = MODES.map(m => `<a class="tab" href="#${m.id}" data-m="${m.id}" title="${m.sub}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[m.id]}</svg>${m.name}</a>`).join('');
  window.addEventListener('hashchange', route);
  let rz, lastO = innerWidth > innerHeight;

    names(list){ nmG.selectAll('text').data(list.filter(d => proj(d.cen)), d => d.id).join('text').attr('class','lbl nm')
      .attr('x', d => proj(d.cen)[0]).attr('y', d => proj(d.cen)[1]).text(d => d.n); updNames(); },
    focus(list, maxK=8){

}

// ---------- typed guess ----------
function makeGuess(host, {placeholder='Type a country', items, onPick, sub}){
  host.classList.add('guess');
  host.innerHTML = `<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"><ul hidden role="listbox"></ul>`;
  const inp = host.querySelector('input'), ul = host.querySelector('ul');
  let list = [], sel = 0;
  const names = d => [d.n, d.o, ...(d.alt || [])].filter(Boolean);
  function show(){
    const t = norm(inp.value); if (!t){ ul.hidden = true; return; }
    const src = items();
    const score = d => { const ns = names(d).map(norm); if (ns[0] === t) return 0; if (ns.some(n => n === t)) return 1; if (ns[0].startsWith(t)) return 2; if (ns.some(n => n.startsWith(t))) return 3; if (ns.some(n => n.includes(t))) return 4; return 9; };
    list = src.map(d => [d, score(d)]).filter(x => x[1] < 9).sort((a,b) => a[1]-b[1] || a[0].n.localeCompare(b[0].n)).slice(0, 8).map(x => x[0]);
    sel = 0; ul.innerHTML = list.length ? list.map((d,i) => `<li role="option" aria-selected="${i===0}" data-i="${i}">${esc(d.n)}${sub ? `<small>${esc(sub(d))}</small>` : ''}</li>`).join('') : '<li>No match</li>';
    ul.hidden = false;
  }
  function pick(d){ ul.hidden = true; inp.value = ''; onPick(d); inp.focus(); }
  inp.addEventListener('input', show);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ if (!list.length) return; e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length; [...ul.children].forEach((li,i) => li.setAttribute('aria-selected', i===sel)); }
    else if (e.key === 'Enter'){ e.preventDefault(); if (!ul.hidden && list[sel]) pick(list[sel]); }
    else if (e.key === 'Escape') ul.hidden = true;
  });
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li && li.dataset.i) { e.preventDefault(); pick(list[+li.dataset.i]); } });
  inp.addEventListener('blur', () => setTimeout(() => ul.hidden = true, 150));
  return {input: inp, disable(v){ inp.disabled = v; }};
}

// ---------- round end ----------

function timer(el){ const t0 = Date.now(); const iv = setInterval(() => { const s = (Date.now()-t0)/1000|0; el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 500); return {stop(){ clearInterval(iv); return (Date.now()-t0)/1000|0; }}; }

// ---- Find It ----

// ---- Shape (silhouette) ----
function bearing(a, b){ const r = Math.PI/180, [l1,p1] = [a[0]*r,a[1]*r], [l2,p2] = [b[0]*r,b[1]*r];
  const y = Math.sin(l2-l1)*Math.cos(p2), x = Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(l2-l1); return (Math.atan2(y,x)/r + 360) % 360; }

  const sp = d3.geoAzimuthalEqualArea().rotate([-target.cen[0], -target.cen[1]]).fitExtent([[14,14],[226,226]], target.ft);

      return `<div class="grow${win ? ' win' : ''}"><span class="nm">${esc(g.n)}</span><span class="num">${win ? '0' : fmt(d)} km</span><span class="arrow" style="transform:rotate(${b}deg)" aria-label="direction">${win ? '★' : '↑'}</span><span class="num">${win ? 100 : p}%</span></div>`; }).join('') +

  $('#give').onclick = () => end(false);

// ---- Hot & Cold ----
const SAMPLES = new Map();
function samples(d){ if (SAMPLES.has(d.id)) return SAMPLES.get(d.id); const pts = [];
  (function walk(c){ if (typeof c[0] === 'number') pts.push(c); else c.forEach(walk); })(d.ft.geometry.coordinates);
  const step = Math.max(1, Math.ceil(pts.length/140)); const s = pts.filter((_,i) => i % step === 0); SAMPLES.set(d.id, s); return s; }
function gap(a, b){ if (a.id === b.id) return 0; if ((a.b0 || a.b)?.includes(b.id) || (b.b0 || b.b)?.includes(a.id)) return 0;
  const A = samples(a), B = samples(b); let m = Infinity; for (const p of A) for (const q of B){ const d = d3.geoDistance(p,q); if (d < m) m = d; } return m * R; }
function makeGlobe(host, {items, center=[0,20]}){

  const proj = d3.geoOrthographic().fitExtent([[20,20],[W-20,H-20]], {type:'Sphere'}).rotate([-center[0], -center[1]]).clipAngle(90);
  const s0 = proj.scale(); const path = d3.geoPath(proj);
  svg.append('rect').attr('class','water').attr('width',W).attr('height',H);
  const sph = svg.append('path').attr('class','sphere').datum({type:'Sphere'});
  const grat = svg.append('path').attr('class','grat').datum(d3.geoGraticule10());
  const fp = svg.append('g').selectAll('path').data(items, d => d.id).join('path').attr('class', d => 'f c' + (d.ci ?? 0));
  const lab = svg.append('g'); const labels = new Map();
  function redraw(){ sph.attr('d', path); grat.attr('d', path); fp.attr('d', d => path(d.f));
    const r = proj.rotate(), c = [-r[0], -r[1]];
    const gpx = W / Math.max(1, svg.node().getBoundingClientRect().width || W);
    lab.selectAll('text').data([...labels.values()], d => d.d.id).join('text').attr('class', d => 'lbl ' + d.cls).attr('font-size', 14*gpx).attr('stroke-width', 3.5*gpx)
      .attr('display', d => d3.geoDistance(d.d.cen, c) < Math.PI/2 - .05 ? null : 'none')
      .attr('x', d => proj(d.d.cen)[0]).attr('y', d => proj(d.d.cen)[1]).text(d => d.t); }
  svg.call(d3.drag().on('drag', e => { const r = proj.rotate(), k = 70/proj.scale(); proj.rotate([r[0] + e.dx*k, Math.max(-85, Math.min(85, r[1] - e.dy*k))]); redraw(); }));
  svg.on('wheel', e => { e.preventDefault(); proj.scale(Math.max(s0*.8, Math.min(s0*8, proj.scale() * (e.deltaY < 0 ? 1.12 : 1/1.12)))); redraw(); }, {passive:false});
  const zc = document.createElement('div'); zc.className = 'zoomctl';
  zc.innerHTML = '<button type="button" aria-label="Zoom in">+</button><button type="button" aria-label="Zoom out">−</button>';
  zc.children[0].onclick = () => { proj.scale(Math.min(s0*8, proj.scale()*1.5)); redraw(); };
  zc.children[1].onclick = () => { proj.scale(Math.max(s0*.8, proj.scale()/1.5)); redraw(); };

    focus(list){ const to = list[0].cen; const r0 = proj.rotate(), r1 = [-to[0], -to[1]]; const ip = d3.interpolate(r0, r1);
      d3.transition().duration(800).tween('rot', () => t => { proj.rotate(ip(t)); redraw(); }); },
    reset(){}
  };
}
function modeHot(){

// ---- Border Chain ----
function bfs(src, ids){ const dist = new Map([[src.id, 0]]), q = [src]; while (q.length){ const d = q.shift(); for (const n of d.b || []){ const nd = BY.get(n); if (!nd || (ids && !ids.has(n)) || dist.has(n)) continue; dist.set(n, dist.get(d.id) + 1); q.push(nd); } } return dist; }
function modeChain(){
  const U = universe(S.set); const P = pool().filter(d => d.b && d.b.length);
  const [lo, hi] = {easy:[2,3], medium:[3,5], hard:[4,7]}[S.diff];
  let A, B, dA, D;
  for (let t = 0; t < 80; t++){ A = pickN('chain', P, 1)[0]; dA = bfs(A); const cand = P.filter(d => { const x = dA.get(d.id); return x >= lo && x <= hi; }); if (cand.length){ B = cand[Math.random()*cand.length|0]; break; } }
  if (!B){ panel.innerHTML = head('Border Chain','Not enough land borders in this map at this level. Try a bigger region or another difficulty.'); return; }
  D = dA.get(B.id); const dB = bfs(B);
  const path0 = [A]; let cur = A; while (cur.id !== B.id){ cur = BY.get(cur.b.find(n => dA.get(n) === dA.get(cur.id)+1 && dB.get(n) === D - dA.get(cur.id) - 1)); path0.push(cur); }
  const MAXG = D - 1 + 4;
  const tapOK = S.diff === 'easy';
  panel.innerHTML = head('Border Chain', `Connect the two ${S.set === 'us' ? 'states' : 'countries'} through shared land borders. Shortest chain needs ${D-1} in between.${tapOK ? ' On Easy you can also tap the map.' : ''}`, 'chain', P) +
    `<div class="chainhead">${esc(A.n)} <span>to</span> ${esc(B.n)}</div>
     <div id="gin"></div><div class="stats"><span>Guesses <b id="gc">0</b>/${MAXG}</span><span>Best <b>${D-1}</b></span></div>
     <div class="chips" id="gl"></div><p class="note">Green is on a shortest route. Orange still borders things but takes the long way.</p>
     <div class="row"><button class="btn" id="hint" type="button">Hint (costs a guess)</button><button class="btn" id="give" type="button">Show route</button><button class="btn" id="nxt" type="button" hidden>New chain</button></div><div id="endh"></div>`;
  const guessed = []; let done = false, used = 0; let map;
  function onPath(d){ return dA.get(d.id) + dB.get(d.id) === D; }
  function linked(){ const ids = new Set([A.id, B.id, ...guessed.map(d => d.id)]); return bfs(A, ids).has(B.id); }
  function draw(){ $('#gc').textContent = used; $('#gl').innerHTML = guessed.map(d => `<span class="chip ${onPath(d) ? 'on' : 'off'}${d._h ? ' hintc' : ''}">${esc(d.n)}</span>`).join(''); }
  function guess(d, viaHint){
    if (done || d.id === A.id || d.id === B.id || guessed.includes(d)) return;
    d._h = !!viaHint; guessed.push(d); used++;
    map.cls(d.id, onPath(d) ? 'ok' : 'meh'); map.label(d, d.n); draw();
    if (linked()) end(true); else if (used >= MAXG) end(false);
  }
  const gi = makeGuess($('#gin'), {placeholder: S.set === 'us' ? 'Type a state' : 'Type a country', items:() => U.filter(d => !guessed.includes(d) && d !== A && d !== B), onPick:d => guess(d)});
  map = makeMap(stage, {fit:path0, onPick: tapOK ? (d => guess(d)) : null, active: tapOK ? new Set(U.filter(d => d.type === 'state' || (d.sov && d.b.length)).map(d => d.id)) : new Set()});
  map.cls(A.id, 'endpt'); map.cls(B.id, 'endpt'); map.label(A, A.n, 'end'); map.label(B, B.n, 'end');
  $('#hint').onclick = () => { const n = path0.slice(1,-1).find(d => !guessed.includes(d)) || U.find(d => onPath(d) && !guessed.includes(d) && d !== A && d !== B); if (n) guess(n, true); };
  $('#give').onclick = () => end(false); $('#nxt').onclick = () => route();
  function end(win){ done = true; gi.disable(true); rec('chain', A.id, win && used <= D+1);
    if (!win) path0.slice(1,-1).forEach(d => { if (!guessed.includes(d)){ map.cls(d.id,'reveal'); map.label(d, d.n, 'miss'); } });
    ['hint','give'].forEach(id => $('#'+id).hidden = true); $('#nxt').hidden = false;
    $('#endh').innerHTML = `<div class="end"><div class="score">${win ? (used === D-1 ? 'Perfect chain' : `Linked in ${used}`) : 'Route shown'}</div><p>One shortest route: ${path0.map(d => esc(d.n)).join(' → ')}.</p></div>`; }
  draw();
}

// ---- shared Q&A engine for Capitals and Flags ----
// Tricky answer choices for Capitals: the place's own big cities, plus capitals of
// same-language and nearby places. Madrid comes with Barcelona, Lisbon and Buenos Aires.
function nearestTo(q, src, n, filt = () => true){
  return src.filter(d => d !== q && filt(d)).sort((a,b) => d3.geoDistance(a.pt, q.pt) - d3.geoDistance(b.pt, q.pt)).slice(0, n);
}
const sameLang = (a, b) => (a.lang || []).some(l => (b.lang || []).includes(l));
function capChoices(q){
  const src = q.type === 'state' ? US : C.filter(d => d.sov && d.cap?.length);
  const opts = [{html:esc(q.cap[0]), ok:true}], seen = new Set(q.cap.map(norm));
  const add = s => { if (s && opts.length < 4 && !seen.has(norm(s))){ seen.add(norm(s)); opts.push({html:esc(s), ok:false}); } };
  const nCity = S.diff === 'easy' ? 1 : (q.type === 'state' || Math.random() < .5 ? 2 : 1);
  (q.big || []).slice(0, nCity).forEach(add);
  if (q.type === 'country'){ const L = shuffle(nearestTo(q, src, 4, d => sameLang(d, q))); if (L.length) add(L[0].cap[0]); }
  shuffle(nearestTo(q, src, 5)).forEach(d => add(d.cap[0]));
  nearestTo(q, src, 20).forEach(d => add(d.cap[0]));
  return shuffle(opts);
}
function placeChoices(q){
  const src = q.type === 'state' ? US : C.filter(d => d.sov);
  const opts = [q];
  const add = d => { if (d && opts.length < 4 && !opts.includes(d)) opts.push(d); };
  if (q.type === 'country') shuffle(nearestTo(q, src, 4, d => sameLang(d, q))).slice(0, 1).forEach(add);
  shuffle(nearestTo(q, src, 5)).forEach(add);
  nearestTo(q, src, 20).forEach(add);
  return shuffle(opts.map(d => ({html:esc(d.n), ok:d === q})));
}
function distract(q, n, src, key){
  const same = shuffle(src.filter(d => d !== q && (q.type === 'state' || d.r === q.r) && key(d) && key(d) !== key(q)));
  const rest = shuffle(src.filter(d => d !== q && !same.includes(d) && key(d)));
  const out = []; for (const d of [...same, ...rest]){ if (out.length >= n) break; if (!out.some(o => key(o) === key(d))) out.push(d); } return out;
}
function quizRound({mode, title, how, items, P, askHTML, choicesFor, typed, typedItems, check, onShow, after, redo}){
  panel.innerHTML = head(title, how, mode, P) +
    `<div id="ask"></div><div id="ans"></div><div class="stats"><span>Q <b id="qi"></b>/${items.length}</span><span>Score <b id="sc">0</b></span></div>
     <div class="row"><button class="btn primary" id="nx" type="button" hidden>Next</button></div><div id="endh"></div>`;
  let i = 0, right = 0, locked = false; const misses = [];
  function ask(){
    if (i >= items.length) return finish(); locked = false; $('#nx').hidden = true; const q = items[i];
    $('#qi').textContent = i+1; $('#ask').innerHTML = askHTML(q); onShow?.(q, false);
    const ans = $('#ans'); ans.innerHTML = '';
    if (typed){
      const box = document.createElement('div'); ans.appendChild(box);
      if (typedItems){ makeGuess(box, {placeholder: typed, items: typedItems, onPick: d => answer(check(q, d), d.n) }); }
      else { box.className = 'guess'; box.innerHTML = `<input type="text" autocomplete="off" spellcheck="false" placeholder="${esc(typed)}" aria-label="${esc(typed)}">`;
        box.firstChild.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) answer(check(q, e.target.value), e.target.value); }); }
      box.querySelector('input').focus({preventScroll:true});
    } else {
      const ch = choicesFor(q); const g = document.createElement('div'); g.className = 'choices'; ans.appendChild(g);
      ch.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'choice' + (c.flag ? ' flag' : ''); b.innerHTML = c.html; b._ok = c.ok;
        b.onclick = () => { if (locked) return; g.querySelectorAll('.choice').forEach(x => { if (x._ok) x.classList.add('ok'); }); if (!c.ok) b.classList.add('bad'); answer(c.ok); }; g.appendChild(b); });
    }
  }
  function answer(ok){
    if (locked) return; locked = true; const q = items[i]; rec(mode, q.id, ok);
    if (ok){ right++; $('#sc').textContent = right; toast('Correct', 'good'); } else { misses.push(q); }
    if (typed){ $('#ans').insertAdjacentHTML('beforeend', `<div class="prompt" style="background:${ok ? 'var(--good-fill)' : 'var(--bad-fill)'}"><small>${ok ? 'Correct' : 'Answer'}</small><strong>${esc(after(q))}</strong></div>`); $('#ans input').disabled = true; }
    onShow?.(q, true);
    if (ok) setTimeout(() => { if (items[i] === q){ i++; ask(); } }, 1100); else { $('#nx').hidden = false; $('#nx').focus({preventScroll:true}); }
  }

  function finish(){ $('#ask').innerHTML = ''; $('#ans').innerHTML = ''; $('#nx').hidden = true;
    endCard($('#endh'), {right, total:items.length, misses, again:() => route(), drill:m => { cleanup?.(); panel.innerHTML=''; stage.innerHTML=''; cleanup = redo(m); }}); }
  ask();
}
function dirToggle(key, opts){
  const wrap = document.createElement('div'); wrap.className = 'seg'; wrap.setAttribute('role','group');
  wrap.innerHTML = opts.map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join('');
  wrap.onclick = e => { const v = e.target.dataset.v; if (!v) return; S[key] = v; saveS(); route(); };
  return wrap;
}

// ---- Capitals ----
function modeCapitals(preset){
  const P = pool().filter(d => d.cap && d.cap.length); const items = preset || pickN('cap-' + S.capDir, P, Math.min(10, P.length));

    how: fwd ? `Name the capital. ${hard ? 'Type it; small typos are fine.' : 'Pick one of four.'}` : `Which ${S.set === 'us' ? 'state' : 'country'} is this the capital of?`,
    askHTML: q => fwd ? `<div class="prompt"><small>Capital of</small><strong>${esc(q.n)}</strong></div>` : `<div class="prompt"><small>${S.set === 'us' ? 'State' : 'Country'} with the capital</small><strong>${esc(q.cap[0])}</strong></div>`,

// ---- Flags ----

// ---- Nature: rivers, lakes, seas, mountains, deserts, landforms, peaks, islands ----
let NAT = null;
const NTYPES = {all:'All features', river:'Rivers', lake:'Lakes', sea:'Seas & oceans', mountain:'Mountains', desert:'Deserts', land:'Landforms', peak:'Peaks', island:'Islands'};
const NWORD = {river:'river', lake:'lake', sea:'sea or ocean', mountain:'mountain range', desert:'desert', land:'landform', peak:'peak', island:'island'};
const NVERB = {river:'Flows through', lake:'Borders', sea:'Touches', mountain:'Runs through', desert:'Covers parts of', land:'Covers parts of', peak:'Stands in', island:'Belongs to'};
function loadNature(){
  if (NAT) return Promise.resolve(NAT);
  return fetch('data/nature.json').then(r => { if (!r.ok) throw new Error('nature'); return r.json(); }).then(a => {
    NAT = a.map(d => { d.f = {type:'Feature', geometry:d.g}; d.ft = d.f; d.isLine = /LineString/.test(d.g.type); d.isPt = d.g.type === 'Point';
      d.cen = d.isPt ? d.g.coordinates : d.isLine ? natMid(d.g) : d3.geoCentroid(d.f); d.pt = d.cen; d.alt = []; return d; });
    return NAT; });
}
function natMid(g){ const lines = g.type === 'LineString' ? [g.coordinates] : g.coordinates; const L = lines.reduce((a,b) => b.length > a.length ? b : a); return L[Math.floor(L.length/2)]; }
function natIn(d, set){
  if (set === 'world') return true;
  if (set === 'us') return d.s.length > 0;
  // Its middle must sit inside the region's box, so Russia's Siberian rivers don't count as European.
  const b = BOX[set], x = d.cen[0], y = d.cen[1], m = 4;
  if (!(x >= b[0]-m && x <= b[2]+m && y >= b[1]-m && y <= b[3]+m)) return false;
  return !d.c.length || d.c.some(id => { const c = BY.get(id); return c && inRegion(c, set); });
}
function natPool(){
  const all = NAT.filter(d => natIn(d, S.set) && (S.natType === 'all' || d.type === S.natType));
  let lvl = {easy:1, medium:2, hard:3}[S.diff], out = all.filter(d => d.tier <= lvl);
  while (out.length < 6 && lvl < 3){ lvl++; out = all.filter(d => d.tier <= lvl); }
  return out;
}
function natTouches(d){
  const ids = S.set === 'us' && d.s.length ? d.s : d.c;
  const ns = ids.map(id => BY.get(id)?.n).filter(Boolean);
  if (!ns.length) return '';
  return `${NVERB[d.type]} ${ns.length > 5 ? ns.slice(0,5).join(', ') + ` and ${ns.length - 5} more` : ns.join(', ')}`;
}
function drawNature(map, feats, onPick){
  // Big areas go underneath and small ones on top, then rivers, then peaks, so nothing hides a smaller feature.
  const rank = d => d.isPt ? 2 : d.isLine ? 1 : 0;
  const area = d => d._a ?? (d._a = d.isPt || d.isLine ? 0 : d3.geoArea(d.f));
  feats = feats.slice().sort((a,b) => rank(a) - rank(b) || area(b) - area(a));
  const G = map.natG; G.selectAll('*').remove();
  const sel = G.selectAll('g').data(feats, d => d.id).join('g').attr('class', d => 'nf n-' + d.type + (/Ocean/.test(d.n) ? ' ocean' : ''));
  sel.each(function(d){ const s = d3.select(this);
    if (d.isPt){ const p = map.proj(d.g.coordinates); if (p) s.append('path').attr('class','pk').attr('transform', `translate(${p[0]},${p[1]})`); }
    else if (d.isLine){ const dd = map.path(d.f); s.append('path').attr('class','rvc').attr('d', dd); s.append('path').attr('class','rv').attr('d', dd); s.append('path').attr('class','hit').attr('d', dd); }
    else s.append('path').attr('class','pg').attr('d', map.path(d.f)); });
  if (onPick) sel.on('click', (e,d) => { e.stopPropagation(); onPick(d, e); });
  map.onZoom(k => { const p = map.px();
    G.selectAll('.rvc').attr('stroke-width', 6.5 * p / k);
    G.selectAll('.rv').attr('stroke-width', 3.4 * p / k);
    G.selectAll('.hit').attr('stroke-width', 22 * p / k);
    G.selectAll('.pk').attr('d', d3.symbol(d3.symbolTriangle, Math.pow(22 * p / k, 2))()); });
  const pick = id => sel.filter(d => d.id === id);
  return {
    under(e){ return document.elementsFromPoint(e.clientX, e.clientY).map(el => el.closest && el.closest('.nf')).filter(Boolean).map(g => d3.select(g).datum()); },
    show(f){ sel.attr('display', d => f(d) ? null : 'none'); },
    cls(id, c, on=true){ pick(id).classed(c, on); },
    clear(c){ sel.classed(c, false); },

// Pick up to n features whose areas don't overlap (rivers may cross areas, but not share a spot with another river's label).
function natSpread(list, n){
  const box = d => d._bb || (d._bb = d3.geoBounds(d.f));
  const inter = (a, b) => { const A = box(a), B = box(b); const w = Math.min(A[1][0], B[1][0]) - Math.max(A[0][0], B[0][0]), h = Math.min(A[1][1], B[1][1]) - Math.max(A[0][1], B[0][1]);
    if (w <= 0 || h <= 0) return 0; const aa = Math.max(.01, (A[1][0]-A[0][0]) * (A[1][1]-A[0][1])), bb = Math.max(.01, (B[1][0]-B[0][0]) * (B[1][1]-B[0][1])); return (w*h) / Math.min(aa, bb); };
  const clash = (a, b) => {
    if (a.isLine && b.isLine) return d3.geoDistance(a.cen, b.cen) < .05;
    if (a.isLine || b.isLine) return false;
    if (a.isPt || b.isPt){ const p = a.isPt ? a : b, o = a.isPt ? b : a; return o.isPt ? d3.geoDistance(p.cen, o.cen) < .03 : d3.geoContains(o.f, p.g.coordinates); }
    return inter(a, b) > .15 || d3.geoContains(a.f, b.cen) || d3.geoContains(b.f, a.cen);
  };
  const out = [];
  for (const d of list){ if (out.length >= n) break; if (!out.some(o => clash(o, d))) out.push(d); }
  return out;
}

  panel.innerHTML = head('Players', `Who knows ${esc(SETS[S.set])} best. "Known" means answered right at least twice and more often than missed. Chains counts chains solved.`) +
    `<div class="row"><button class="btn primary" type="button" id="addp">Add player</button></div>
     <div><p class="lab">Playing as</p><div class="chips">${PLAYERS.map(p => `<button type="button" class="chip${p === S.player ? ' on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
     <p class="note">Progress is saved in this browser. Each device keeps its own players.</p>`;
  $('#addp').onclick = () => renderPlayers(true);
  panel.querySelectorAll('[data-p]').forEach(b => b.onclick = () => switchPlayer(b.dataset.p));
  stage.style.background = 'var(--panel)'; stage.style.overflow = 'auto';
  stage.innerHTML = `<div style="padding:16px" class="scroll"><table class="board"><thead><tr><th>Player</th>${BOARD.map(b => `<th>${b[1]}</th>`).join('')}<th>Total</th><th>Accuracy</th></tr></thead><tbody>${
    all.map(r => `<tr class="${r.p === S.player ? 'me' : ''}"><td>${esc(r.p)}${r.total === top && top > 0 ? ' ★' : ''}</td>${r.cols.map((c,i) => `<td class="${c === best[i] && c > 0 ? 'lead' : ''}">${c}</td>`).join('')}<td>${r.total}</td><td>${r.ans ? r.acc + '%' : '–'}</td></tr>`).join('')
  }</tbody></table><p class="note" style="margin-top:12px">Out of ${items.length} ${S.set === 'us' ? 'states' : 'countries'} per column at the current map. Switch the map above to compare another region.</p></div>`;
  return () => { stage.style.background = ''; stage.style.overflow = ''; };
}

// ---------- boot ----------
shell();
Promise.all(['data/world.json','data/states.json'].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); })))
  .then(([w, s]) => {
    C = w.map(d => prep(d, 'country')).sort((a,b) => a.n.localeCompare(b.n));
    colorize(C, d => d.b0 || d.b);
    US = s.map(d => prep(d, 'state')).sort((a,b) => a.n.localeCompare(b.n));
    colorize(US, d => d.b);
    route();
  })
  .catch(err => { panel.innerHTML = `<p>Could not load the map data (${esc(err.message)}). Reload the page to try again.</p>`; });
</script>
</body>
</html>
